<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <base href="/">
  <title>磨飯 SMT Master V1.0</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app-shell.css?v=native-core-supply-v1">
  <link rel="stylesheet" href="mobile-profile.css?v=native-core-supply-v1">
  <link rel="stylesheet" href="dev-preview-entry.css?v=qa-entry-v2">
</head>
<body>
  <main id="viewport">
    <section id="shell-app" aria-label="磨飯 SMT">
      <header id="global-statusbar" class="global-shell-status">
        <div class="shell-brand"><span>磨</span><strong>磨飯 SMT</strong></div>
        <b id="shell-terminal">SMT</b>
        <span id="shell-online"><i></i>本機模式</span>
        <div class="shell-route-state"><small>目前頁面</small><strong id="shell-route-label">點餐</strong></div>
        <div class="shell-spacer"><a id="dev-preview-entry" href="dev-preview.html">尺寸驗收</a></div>
        <div id="shell-page-actions" class="shell-page-actions" aria-label="目前頁面快捷功能"></div>
        <div id="shell-context" class="shell-context">準備營業</div>
      </header>
      <section id="page-host"><section id="stage"><iframe id="page" class="shell-page is-loading" aria-hidden="true" tabindex="-1" title="磨飯 SMT"></iframe></section><div id="route-feedback" class="route-feedback" hidden><span></span><strong>切換中…</strong></div></section>
      <nav id="global-bottom-nav" class="global-bottom-nav" aria-label="主要功能"><button class="active" data-route="order" aria-current="page"><span>▣</span><b>點餐</b></button><button data-route="orders"><span>▤</span><b>訂單</b></button><button data-route="dine"><span>⌂</span><b>堂食</b></button><button data-route="soldout"><span>⊘</span><b>售罄</b></button><button data-route="more"><span>•••</span><b>更多</b></button></nav>
    </section>
    <section id="startup-gate" class="startup-gate" aria-live="polite">
      <div class="startup-card" data-startup-step="login"><div class="startup-brand"><span>磨</span><div><strong>磨飯 SMT</strong><small>員工登入</small></div></div><form data-form="login"><label>Staff 編號<input name="username" autocomplete="username" placeholder="輸入 Staff 編號" required></label><label>6 位密碼<input name="password" type="password" autocomplete="current-password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required></label><label class="startup-remember"><input name="rememberLogin" type="checkbox" checked> 記住登入（關機／重開後仍然有效）</label><p id="startup-error" class="startup-error" hidden></p><button type="submit" class="startup-primary">登入</button></form></div>
      <div class="startup-card" data-startup-step="cash" hidden><div class="startup-brand"><span>＄</span><div><strong>今日開工現金</strong><small>登入：<b id="opening-operator">Staff</b></small></div></div><form data-form="cash"><div class="cash-summary"><span>昨日留底<strong id="opening-previous">$0</strong></span><span>今日開工<strong id="opening-total">$0</strong></span></div><label>今日加減調整<input name="opening-adjustment" type="number" step="0.1" inputmode="decimal" value="0"></label><small class="startup-note">正數代表補入錢櫃，負數代表先取走。確認後會作為今日現金基準。</small><button type="submit" class="startup-primary">確認開工</button></form></div>
    </section>
    <section id="orientation-lock" aria-live="polite"><div><strong>請旋轉至橫屏使用</strong><p>SMT iPhone 版只支援橫屏操作。</p></div></section>
  </main>
  <script type="module" src="mobile-profile-bootstrap.js?v=native-mobile-profile-v1"></script>
  <script type="module" src="shell-startup.js?v=native-core-supply-v1"></script>
  <script type="module" src="shared/supply-session-control.js?v=native-core-supply-v1"></script>
  <script type="module" src="app-loader.js?v=native-mobile-profile-v1"></script>
  <script type="module" src="shared/status-actions.js?v=global-actions-owner-v3"></script>
  <script src="dev-preview-entry.js?v=qa-entry-v2"></script>
</body>
</html>
