name: qa-runtime-phase3-finalize
on:
  push:
    branches: [qa-runtime-phase3-exec-20260726]
    paths: ['.github/workflows/qa-runtime-phase3-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-runtime-phase3-exec-20260726
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align current standards and regression contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Current minimum context must no longer advertise the superseded branch/card language.
          p=Path('SMT_CONTEXT_MIN.md'); t=p.read_text()
          t=t.replace('現行正式分支 `feat/smt-order-page-v1`，版本 `order-v1-31`。舊 Lock 是安全基線；功能真相以最新產品對話、Decision Ledger、Current Lock 為準。','現行功能完整性分支 `smt-functional-completeness-v1`。任何 AI／Codex／Work 開始前必須先讀 `docs/SMT_DEVELOPMENT_CHARTER_V1.0.md`、`docs/MFKG_STANDARD_V1.0.md`、`docs/SMT_ADAPTIVE_APPLICATION_STANDARD_V1.0.md`；三者共同構成 SMT Development Standard。舊 Lock 只作安全回滾；功能真相以三份最高標準、Decision Ledger、Current Lock、Implementation Status 及 MFKG 為準。')
          t=t.replace('快捷飲品平時只見底部把手，展開向上、直向大卡、名稱上圖下、選中橙框加箭嘴；產品修改及統一整理沿用同一語言但尺寸較小。','快捷飲品平時只見底部把手，展開向上；快捷飲品、產品修改套餐飲品、必選整理飲品共用同一 image-first Drink Choice Card 核心，圖片係主要辨認資訊，名稱及選中數量屬次要資訊；容器尺寸可不同但不得另寫第二套 Card。')
          p.write_text(t)

          p=Path('tests/ai-context.test.mjs'); t=p.read_text()
          t=t.replace("  assert.match(start, /order-v1-31/);\n  assert.match(compact, /order-v1-31/);","  assert.match(start, /smt-functional-completeness-v1/);\n  assert.match(start, /SMT_DEVELOPMENT_CHARTER_V1\\.0/);\n  assert.match(compact, /smt-functional-completeness-v1/);\n  assert.match(compact, /SMT Development Standard/);")
          t=t.replace("    assert.ok(['EXTRACTED', 'INFERRED'].includes(edge.evidence));","    assert.ok(graph.evidenceTypes.includes(edge.evidence));")
          p.write_text(t)

          p=Path('tests/more-responsive-contract.test.mjs'); t=p.read_text()
          t=t.replace("'body[data-page=\"more\"] .more-workspace{container-type:size;container-name:more-workspace}'","'body[data-page=\"more\"] .more-workspace{container-type:size;container-name:more-workspace;'")
          p.write_text(t)

          p=Path('tests/order-edit-flow.test.mjs'); t=p.read_text()
          t=t.replace("  assert.match(base,/#app\\{width:1920px;height:100%;min-height:0;overflow:hidden\\}/);","  assert.match(base,/#app\\{width:100%;height:100%;min-width:0;min-height:0;overflow:hidden\\}/);")
          old="""test('子頁啟動錯誤會顯示可見後備畫面而不是白屏',async()=>{\n  const loader=await readFile(new URL('../app-loader.js',import.meta.url),'utf8');\n  assert.match(loader,/morefun:page-runtime-error/);\n  assert.match(loader,/let childReady=false/);\n  assert.match(loader,/morefun:page-ready/);\n  assert.match(loader,/if\\(!childReady\\)showLoaderError/);\n  assert.match(loader,/showLoaderError\\('點單頁啟動失敗/);\n});"""
          new="""test('子頁啟動錯誤會顯示可見後備畫面而不是白屏',async()=>{\n  const loader=await readFile(new URL('../app-loader.js',import.meta.url),'utf8');\n  assert.match(loader,/morefun:page-runtime-error/);\n  assert.match(loader,/loaderErrorDocument/);\n  assert.match(loader,/showLoaderError/);\n  assert.match(loader,/啟動失敗，資料仍保存在本機/);\n  assert.match(loader,/setActiveFrame\\(target,key\\)/);\n});"""
          if old in t:t=t.replace(old,new,1)
          old="""test('all drink selection surfaces share the same vertical card language',()=>{\n  assert.match(page,/drinkChoiceCard\\(d,'quick-drink'.*'drawer'\\)/);\n  assert.match(page,/drinkChoiceCard\\(d,'detail-drink'.*'detail'\\)/);\n  assert.match(page,/drinkChoiceCard\\(d,'completion-drink'.*'completion'\\)/);\n  assert.match(page,/<span>.*<\\/span>'\\+\\(imageMode\\?imageBlock/);\n  assert.match(css,/\\.drink-card--drawer\\s*\\{[^}]*height:\\s*240px/);\n  assert.match(css,/\\.drink-card--detail/);\n  assert.match(css,/\\.drink-card--completion/);\n});"""
          new="""test('all drink selection surfaces share one image-first Drink Choice Card',()=>{\n  assert.match(page,/drinkChoiceCard\\(d,'quick-drink'.*'drawer'\\)/);\n  assert.match(page,/drinkChoiceCard\\(d,'detail-drink'.*'detail'\\)/);\n  assert.match(page,/drinkChoiceCard\\(item,'completion-required-choice'.*'completion'/);\n  const imageIndex=page.indexOf(\"imageMode?imageBlock(d.image,d.name,'drink-choice-img')\");\n  const nameIndex=page.indexOf(\"'<span>'+escapeHtml(d.name)\");\n  assert.ok(imageIndex>=0&&nameIndex>imageIndex,'Drink Choice Card must render image before name');\n  assert.match(css,/\\.drink-card--drawer/);\n  assert.match(css,/\\.drink-card--detail/);\n  assert.match(css,/\\.drink-card--completion/);\n  assert.match(css,/\\.drink-choice-count/);\n});"""
          if old in t:t=t.replace(old,new,1)
          p.write_text(t)

          p=Path('tests/soldout-page.test.mjs'); t=p.read_text()
          t=t.replace("const enhancements=fs.readFileSync(new URL('../pages/soldout/soldout-enhancements.css',import.meta.url),'utf8');","const adaptive=fs.readFileSync(new URL('../shared/adaptive-layout.css',import.meta.url),'utf8');")
          t=t.replace("  assert.doesNotMatch(enhancements,/grayscale\\(/);\n  assert.match(enhancements,/\\.supply-product\\.soldout/);\n  assert.match(enhancements,/\\.supply-product\\.paused/);","  assert.doesNotMatch(css,/grayscale\\(/);\n  assert.match(css,/\\.supply-product\\.soldout/);\n  assert.match(css,/\\.supply-product\\.paused/);")
          old="""test('小圖與純文字卡解除父層點單格線，內容不會被壓成直排',()=>{\n  assert.match(enhancements,/\\.supply-product\\.small\\s*\\{[^}]*display:\\s*block/);\n  assert.match(enhancements,/\\.supply-product\\.text\\s*\\{[^}]*display:\\s*block/);\n  assert.match(enhancements,/\\.supply-product\\.small \\.card-open\\s*\\{[^}]*grid-template-columns:\\s*72px minmax\\(0,1fr\\) auto/);\n});"""
          new="""test('小圖與純文字卡共用點單頁自適應卡尺寸模型',()=>{\n  assert.match(css,/\\.supply-product\\.large,\\.supply-product\\.small,\\.supply-product\\.text\\{display:block/);\n  assert.match(adaptive,/body\\[data-page=\"soldout\"\\] \\.supply-product\\.small \\.card-open\\{[\\s\\S]*?grid-template-columns:min\\(calc\\(var\\(--adaptive-product-row-small\\) - 18px\\),82px\\)/);\n  assert.match(adaptive,/body\\[data-page=\"soldout\"\\] \\.supply-product\\.text \\.card-open\\{[\\s\\S]*?grid-template-columns:minmax\\(0,1fr\\) auto/);\n});"""
          if old in t:t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Run complete regression and syntax verification
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > /tmp/tests.log 2>&1
          TEST_STATUS=$?
          SYNTAX_STATUS=0
          for f in app-loader.js shared/runtime.js shared/adaptive-layout.js shared/page-bridge.js pages/order/page.js pages/order/order-domain.js pages/order/menu-api.js pages/checkout/page.js pages/more/more-domain.js; do node --check "$f" >> /tmp/syntax.log 2>&1 || SYNTAX_STATUS=1; done
          mkdir -p docs/qa
          { echo '# SMT Runtime Phase 3 Final QA'; echo; echo "Candidate: $(git rev-parse HEAD)"; echo; echo '## Regression totals'; grep -E '^# (tests|pass|fail|cancelled|skipped|todo)' /tmp/tests.log || true; echo; echo '## Failing tests'; grep -E '^not ok' /tmp/tests.log || true; echo; echo '## Syntax'; cat /tmp/syntax.log; echo; echo "TEST_STATUS=$TEST_STATUS"; echo "SYNTAX_STATUS=$SYNTAX_STATUS"; if [ "$TEST_STATUS" -eq 0 ] && [ "$SYNTAX_STATUS" -eq 0 ]; then echo 'RESULT=PASS'; else echo 'RESULT=FAIL'; fi; } > docs/qa/SMT_RUNTIME_PHASE3_FINAL_QA.md
          cat docs/qa/SMT_RUNTIME_PHASE3_FINAL_QA.md
      - name: Commit final QA state
        shell: bash
        run: |
          git config user.name morefun-qa-bot
          git config user.email actions@users.noreply.github.com
          git add SMT_CONTEXT_MIN.md tests docs/qa
          git commit -m 'test(runtime): align current standards and final phase 3 contracts' || true
          git push origin HEAD:qa-runtime-phase3-exec-20260726
