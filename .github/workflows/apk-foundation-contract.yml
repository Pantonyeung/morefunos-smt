name: APK Foundation Contract

on:
  pull_request:
    branches:
      - smt-functional-completeness-v1
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  android-foundation:
    if: startsWith(github.head_ref, 'apk-foundation-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Assert Native Bridge authority
        run: |
          test "$(find android/app/src/main/java -name MainActivity.kt | wc -l | tr -d ' ')" = "1"
          ! grep -R "addJavascriptInterface" android/app/src/main/java
          grep -q "WebViewCompat.addWebMessageListener" android/app/src/main/java/hk/morefun/smt/MainActivity.kt
          grep -q '"device.info"' android/app/src/main/java/hk/morefun/smt/BridgeProtocol.kt
          grep -q '"network.status"' android/app/src/main/java/hk/morefun/smt/BridgeProtocol.kt
          grep -q '"print.lan.tcp"' android/app/src/main/java/hk/morefun/smt/BridgeProtocol.kt
          ! grep -q '"print.sunmi.native"' android/app/src/main/java/hk/morefun/smt/BridgeProtocol.kt
          ! grep -q '"offline.queue"' android/app/src/main/java/hk/morefun/smt/BridgeProtocol.kt
          ! grep -q '"update.channel"' android/app/src/main/java/hk/morefun/smt/BridgeProtocol.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install stable Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Assert APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: morefun-smt-foundation-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
