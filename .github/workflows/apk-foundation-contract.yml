name: APK Foundation Contract

on:
  pull_request:
    branches:
      - smt-functional-completeness-v1
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  android-foundation:
    if: startsWith(github.head_ref, 'apk-foundation-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Assert Native Bridge authority and Android 6 floor
        run: |
          main=android/app/src/main/java/hk/morefun/smt/MainActivity.kt
          bridge=android/app/src/main/java/hk/morefun/smt/BridgeProtocol.kt
          bundle=android/app/src/main/java/hk/morefun/smt/WebBundleStore.kt
          offline=android/app/src/main/java/hk/morefun/smt/OfflineQueueStore.kt

          test "$(find android/app/src/main/java -name MainActivity.kt | wc -l | tr -d ' ')" = "1"
          test "$(grep -R -l 'addJavascriptInterface' android/app/src/main/java | wc -l | tr -d ' ')" = "1"
          grep -q 'addJavascriptInterface' "$main"
          test -f android/app/src/main/java/hk/morefun/smt/LegacyBridgeAdapter.kt
          grep -q '@JavascriptInterface' android/app/src/main/java/hk/morefun/smt/LegacyBridgeAdapter.kt
          grep -q 'WebViewFeature.WEB_MESSAGE_LISTENER' "$main"
          grep -q 'WebViewCompat.addWebMessageListener' "$main"

          # Runtime bootstrap: verified bundle first, packaged smt/ assets as factory fallback.
          grep -q 'startUrl = "$localOrigin/runtime/index.html"' "$main"
          grep -q 'bundleStore.prepareRuntimeForLaunch()' "$main"
          grep -q 'bundleStore.open(path) ?: packagedFallback.handle("smt/$path")' "$main"
          test -f android/app/src/main/assets/smt/index.html
          test ! -f android/app/src/main/assets/index.html

          grep -q 'minSdk = 23' android/app/build.gradle.kts
          grep -q 'androidx.webkit:webkit:1.15.0' android/app/build.gradle.kts

          grep -q '"device.info"' "$bridge"
          grep -q '"network.status"' "$bridge"
          grep -q '"print.lan.tcp"' "$bridge"
          ! grep -q '"print.sunmi.native"' "$bridge"

          grep -q '"bundle.verified.install"' "$bridge"
          grep -q '"bundle.version-vault"' "$bridge"
          grep -q '"bundle.health-confirm"' "$bridge"
          grep -q '"bundle.rollback"' "$bridge"
          test -f "$bundle"
          grep -q 'fun installBase64Zip' "$bundle"
          grep -q 'fun vault' "$bundle"
          grep -q 'fun rollback' "$bundle"
          grep -q 'prepareRuntimeForLaunch' "$bundle"

          grep -q '"offline.queue"' "$bridge"
          grep -q '"offline.recovery"' "$bridge"
          test -f "$offline"
          grep -q 'fun enqueue' "$offline"
          grep -q 'fun listPending' "$offline"
          grep -q 'fun retry' "$offline"

          grep -q '"diagnostics"' "$bridge"
          test -f android/app/src/main/java/hk/morefun/smt/HostActions.kt

      - name: Assert legacy Android 6 WebView diagnostic syntax
        shell: bash
        run: |
          file=android/app/src/main/assets/smt/index.html
          test -f "$file"
          if grep -En '\?\.|=>|\bconst\b|\blet\b|\basync\b|\bawait\b' "$file"; then
            echo 'Foundation diagnostic contains syntax that may not parse on old Android 6 WebView.'
            exit 1
          fi
          grep -q 'window.__moreFunLegacyBridgeReceive' "$file"
          grep -q "mode:'binary'" "$file"
          grep -q "commandLanguage:'escpos'" "$file"
          grep -q "commandLanguage:'tspl'" "$file"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install stable Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Assert APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: morefun-smt-foundation-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
