name: oneoff-order-render-dedupe

on:
  push:
    branches:
      - smt-functional-completeness-v1
    paths:
      - .github/workflows/oneoff-order-render-dedupe.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Remove duplicate high-frequency renders
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('pages/order/page.js')
          text=path.read_text()
          replacements=[
            ("  showToast('已組合 '+count+' 份飯團套餐');", "  queue.afterRender(()=>showToast('已組合 '+count+' 份飯團套餐'));"),
            ("  const remaining=pendingSummary(store.get().cart);modal={type:'completion',dirty:false,draft:{activeGroup:'',activeTarget:'',assignments:{}}};render();showToast(requiredGroupLabel(group)+'已完成');", "  modal={type:'completion',dirty:false,draft:{activeGroup:'',activeTarget:'',assignments:{}}};queue.afterRender(()=>showToast(requiredGroupLabel(group)+'已完成'));"),
            ("  showToast('已加入 '+p.name);", "  queue.afterRender(()=>showToast('已加入 '+p.name));"),
            ("  modal=null;render();showToast(editing?'已更新產品':'已加入購物車');", "  modal=null;queue.afterRender(()=>showToast(editing?'已更新產品':'已加入購物車'));"),
            ("  pendingDrinkAssignment=null;modal=null;render();showToast('已補選飲品');", "  pendingDrinkAssignment=null;modal=null;queue.afterRender(()=>showToast('已補選飲品'));"),
            ("  else if(action==='clear-search'){store.set(state=>({...state,searchQuery:''}));render();}", "  else if(action==='clear-search'){store.set(state=>({...state,searchQuery:''}));}"),
          ]
          for old,new in replacements:
            if old not in text:
              raise SystemExit('target not found: '+old[:90])
            text=text.replace(old,new,1)
          path.write_text(text)

          index=Path('pages/order/index.html')
          html=index.read_text()
          html=html.replace('page.js?v=order-core-v7','page.js?v=order-core-v8')
          index.write_text(html)
          PY
      - name: Verify dedupe
        run: |
          grep -q "queue.afterRender" pages/order/page.js
          grep -q "page.js?v=order-core-v8" pages/order/index.html
          ! grep -q "const remaining=pendingSummary(store.get().cart);modal=" pages/order/page.js
      - name: Commit refactor
        run: |
          git config user.name "morefun-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/order/page.js pages/order/index.html
          git commit -m "perf(order): remove duplicate high-frequency renders" || exit 0
          git push origin HEAD:smt-functional-completeness-v1
