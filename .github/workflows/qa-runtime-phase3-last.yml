name: qa-runtime-phase3-last
on:
  push:
    branches: [qa-runtime-phase3-exec-20260726]
    paths: ['.github/workflows/qa-runtime-phase3-last.yml']
permissions:
  contents: write
jobs:
  final-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-runtime-phase3-exec-20260726
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix global shell ownership of More heading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('shared/page-base.css'); t=p.read_text()
          rule=':root[data-global-shell="1"] body[data-page="more"] .more-heading{display:none}\n'
          if rule not in t:
            marker=':root[data-global-shell="1"] .workspace{min-height:0}\n'
            if marker not in t: raise SystemExit('global shell marker missing')
            t=t.replace(marker,marker+rule,1)
          p.write_text(t)

          p=Path('tests/more-responsive-contract.test.mjs'); t=p.read_text()
          old="assert.ok(loader.includes('body[data-page=\"more\"] .more-heading{display:none!important}'),'global shell must own the More page title');"
          new="const baseCss=fs.readFileSync(new URL('../shared/page-base.css',import.meta.url),'utf8');\nassert.ok(baseCss.includes(':root[data-global-shell=\"1\"] body[data-page=\"more\"] .more-heading{display:none}'),'global shell must own the More page title');"
          if old in t:t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Run complete final verification
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > /tmp/tests.log 2>&1
          TEST_STATUS=$?
          SYNTAX_STATUS=0
          for f in app-loader.js shared/runtime.js shared/adaptive-layout.js shared/page-bridge.js pages/order/page.js pages/order/order-domain.js pages/order/menu-api.js pages/checkout/page.js pages/more/more-domain.js; do node --check "$f" >> /tmp/syntax.log 2>&1 || SYNTAX_STATUS=1; done
          mkdir -p docs/qa
          { echo '# SMT Runtime Phase 3 Release Candidate QA'; echo; echo "Candidate: $(git rev-parse HEAD)"; echo; echo '## Regression totals'; grep -E '^# (tests|pass|fail|cancelled|skipped|todo)' /tmp/tests.log || true; echo; echo '## Failing tests'; grep -E '^not ok' /tmp/tests.log || true; echo; echo '## Syntax'; cat /tmp/syntax.log; echo; echo "TEST_STATUS=$TEST_STATUS"; echo "SYNTAX_STATUS=$SYNTAX_STATUS"; if [ "$TEST_STATUS" -eq 0 ] && [ "$SYNTAX_STATUS" -eq 0 ]; then echo 'RESULT=PASS'; else echo 'RESULT=FAIL'; fi; } > docs/qa/SMT_RUNTIME_PHASE3_RELEASE_QA.md
          cat docs/qa/SMT_RUNTIME_PHASE3_RELEASE_QA.md
      - name: Commit verified candidate
        shell: bash
        run: |
          git config user.name morefun-qa-bot
          git config user.email actions@users.noreply.github.com
          git add shared/page-base.css tests/more-responsive-contract.test.mjs docs/qa
          git commit -m 'fix(shell): enforce global title ownership and verify phase 3' || true
          git push origin HEAD:qa-runtime-phase3-exec-20260726
