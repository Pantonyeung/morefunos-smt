name: ownership-cleanup-driver-main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'ownership-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ownership-cleanup-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V1/V2 ownership migration when pending
        run: |
          if [ -f scripts/ownership-cleanup-once.mjs ]; then
            node scripts/ownership-cleanup-once.mjs
          else
            echo 'ownership migration already applied'
          fi
      - name: Ownership audit
        run: node scripts/audit-component-ownership.mjs
      - name: AI context validation
        run: node scripts/validate-ai-context.mjs
      - name: Full regression
        run: node --test tests/*.test.mjs
      - name: Commit verified cleanup branch when changed
        run: |
          rm -f scripts/ownership-cleanup-once.mjs .github/workflows/ownership-cleanup-v1.yml
          git config user.name 'MoreFun Ownership QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit'
          else
            git commit -m 'refactor(ownership): consolidate cart and drink card owners'
            git push origin HEAD:ownership-cleanup-v1
          fi
