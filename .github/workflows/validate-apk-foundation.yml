name: Validate APK Foundation

on:
  push:
    branches:
      - smt-functional-completeness-v1
    paths:
      - '.github/workflows/validate-apk-foundation.yml'
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-apk-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'apk-foundation-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout APK foundation branch
        uses: actions/checkout@v4
        with:
          ref: apk-foundation-v1

      - name: Run static foundation preflight
        run: bash android/verify-foundation.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile debug APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK and checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: morefun-smt-foundation-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7