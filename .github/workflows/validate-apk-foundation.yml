name: Validate APK Foundation

on:
  push:
    branches:
      - apk-foundation-v1
    paths:
      - 'android/**'
      - '.github/workflows/validate-apk-foundation.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'android/**'
      - '.github/workflows/validate-apk-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-apk-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run static foundation preflight
        run: bash android/verify-foundation.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile debug APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and checksum APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: morefun-smt-foundation-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
