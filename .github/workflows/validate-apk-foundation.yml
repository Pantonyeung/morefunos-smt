name: Validate APK Foundation

on:
  pull_request:
    branches:
      - smt-functional-completeness-v1
    paths:
      - 'android/**'
      - '.github/workflows/validate-apk-foundation.yml'

permissions:
  contents: read

concurrency:
  group: validate-apk-foundation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.event.pull_request.head.ref == 'apk-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run static foundation preflight
        run: bash android/verify-foundation.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: morefun-smt-foundation-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
