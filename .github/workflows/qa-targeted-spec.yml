# retrigger: clean adaptive full matrix 4a3f94c
name: QA Targeted Single Spec

on:
  push:
    branches: [qa-root-cause-fix-v1]
    paths:
      - '.qa-target'
      - '.github/workflows/qa-targeted-spec.yml'
      - 'tests/*.spec.js'
      - 'shared/responsive.js'
      - 'shared/runtime.js'

concurrency:
  group: qa-targeted-spec-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  targeted-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static SMT server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/morefun-smt-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/morefun-smt-http.log
          exit 1
      - name: Run targeted spec or full browser matrix
        id: targeted
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          target="$(tr -d '\r\n' < .qa-target)"
          case "$target" in
            FULL_BROWSER_MATRIX|tests/*.spec.js) ;;
            *) echo "Invalid target: $target" | tee /tmp/qa-targeted.log; exit 2 ;;
          esac
          echo "TARGET=$target" | tee /tmp/qa-targeted.log
          if [ "$target" = 'FULL_BROWSER_MATRIX' ]; then
            timeout --signal=TERM --kill-after=15s 1200s npx playwright test --reporter=line 2>&1 | tee -a /tmp/qa-targeted.log
          else
            test -f "$target" || { echo "Missing target: $target" | tee -a /tmp/qa-targeted.log; exit 2; }
            timeout --signal=TERM --kill-after=15s 360s npx playwright test "$target" --reporter=line 2>&1 | tee -a /tmp/qa-targeted.log
          fi
          exit ${PIPESTATUS[0]}
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-targeted-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/qa-targeted.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish targeted result marker
        if: always()
        uses: actions/github-script@v7
        env:
          TARGET_OUTCOME: ${{ steps.targeted.outcome }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/qa-targeted-last-result.txt';
            const branch = 'qa-root-cause-fix-v1';
            const target = fs.readFileSync('.qa-target', 'utf8').trim();

            const branchRef = await github.rest.git.getRef({owner, repo, ref:`heads/${branch}`});
            const currentHeadSha = branchRef.data.object.sha;
            if (currentHeadSha !== context.sha) {
              core.notice(`Skip stale marker: run sha ${context.sha} != branch head ${currentHeadSha}`);
              return;
            }

            const targetAtHeadResponse = await github.rest.repos.getContent({owner, repo, path:'.qa-target', ref:branch});
            const targetAtHead = Buffer.from(targetAtHeadResponse.data.content, 'base64').toString('utf8').trim();
            if (targetAtHead !== target) {
              core.notice(`Skip stale marker: run target ${target} != branch target ${targetAtHead}`);
              return;
            }

            let tail = '';
            try {
              tail = fs.readFileSync('/tmp/qa-targeted.log', 'utf8').split('\n').slice(-100).join('\n');
            } catch {}
            const body = [
              `status=${process.env.TARGET_OUTCOME}`,
              `target=${target}`,
              `run_id=${context.runId}`,
              `sha=${context.sha}`,
              `updated_at=${new Date().toISOString()}`,
              '--- error_tail ---',
              tail,
              ''
            ].join('\n');
            const content = Buffer.from(body).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner, repo,path,ref:branch});
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `ci(qa): record targeted ${process.env.TARGET_OUTCOME}`,
              content,
              sha
            });
      - name: Enforce targeted result
        if: always()
        run: test '${{ steps.targeted.outcome }}' = 'success'
