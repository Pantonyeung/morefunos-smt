name: order-page-batch-finalize-v1
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/order-page-batch-finalize-v1.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize order page batch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/order/page.js'); t=p.read_text()
          old="</header><div class=\"cart-list\">'+cartRows()+'</div>'+pendingArea()+'<footer>"
          new="</header><div class=\"cart-list\">'+cartRows()+'</div>'+cartPricingStrip(state)+pendingArea()+'<footer>"
          if old not in t: raise SystemExit('cart surface pricing insertion target missing')
          t=t.replace(old,new,1)
          old_header='<span class="quick-scroll-hint">左右滑動查看更多 ›</span><button data-action="toggle-quick-drawer">×</button>'
          new_header='<span class="quick-drawer-tools"><button data-action="quick-drink-specified">指定餐點</button><em class="quick-scroll-hint">左右滑動 ›</em></span><button data-action="toggle-quick-drawer">×</button>'
          if old_header in t:t=t.replace(old_header,new_header,1)
          anchor="else if(action==='quick-drink'){\n"
          insert="""else if(action==='quick-drink-specified'){\n    const missing=pendingSummary(store.get().cart).drink;if(!missing){showToast('目前沒有待補飲品');return;}\n    modal={type:'completion',dirty:false,draft:{activeGroup:'drink',activeTarget:'',assignments:{}}};render();\n  }\n  """
          if "action==='quick-drink-specified'" not in t:
            if anchor not in t: raise SystemExit('quick drink handler target missing')
            t=t.replace(anchor,insert+anchor,1)
          p.write_text(t)

          p=Path('pages/order/cart.css'); t=p.read_text()
          marker='.quick-scroll-hint{'
          if '.quick-drawer-tools{' not in t:
            css='.quick-drawer-tools{justify-self:end;display:flex;align-items:center;gap:10px}.quick-drawer-tools>button{min-height:32px;padding:0 10px;border:1px solid #e3d6cd;border-radius:9px;background:#fff;color:#6f5b4f;font-size:11px;font-weight:900}.quick-drawer-tools>button:active{background:#fff1e8;color:#b84216}\n'
            t=t.replace(marker,css+marker,1)
          p.write_text(t)

          p=Path('pages/order/index.html'); t=p.read_text().replace('order-core-v17','order-core-v18');p.write_text(t)
          PY
      - name: Verify full suite
        shell: bash
        run: |
          node --check pages/order/page.js
          node --test tests/*.test.mjs
      - name: Commit verified finalize
        shell: bash
        run: |
          git config user.name 'MoreFun SMT QA'
          git config user.email 'actions@morefun.local'
          git add pages/order/page.js pages/order/cart.css pages/order/index.html
          git commit -m 'feat(order): finalize cart pricing and specified drink workflow'
          git push origin HEAD:smt-functional-completeness-v1
