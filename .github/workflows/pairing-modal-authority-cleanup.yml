name: Pairing Modal Authority Cleanup

on:
  pull_request:
    branches:
      - smt-functional-completeness-v1
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: pairing-modal-authority-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: startsWith(github.head_ref, 'pairing-modal-legacy-cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Pairing owner contracts
        run: node --test tests/pairing-modal-visual-authority.test.mjs
      - name: Apply guarded Pairing Modal legacy cleanup
        run: node scripts/cleanup-order-page-pairing-modal-legacy.mjs
      - name: Verify Pairing regression assertions use final authority
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('tests/order-edit-flow.test.mjs','utf8');
          const required=[
            "const pairingCss = await readFile(new URL('../pages/order/pairing-modal.css', import.meta.url), 'utf8');",
            "assert.match(pairingCss,/\\.specified-link-card \\.link-candidates\\s*\\{[^}]*grid-template-columns:repeat\\(3/);",
            "assert.match(pairingCss,/\\.specified-link-card/);",
          ];
          for(const needle of required){if(!text.includes(needle))throw new Error('Pairing regression authority missing: '+needle);}
          if(text.includes('assert.match(css,/\\.specified-link-card/);'))throw new Error('Legacy page.css Pairing assertion remains');
          NODE
      - name: Assert Pairing legacy selectors are absent
        run: |
          if grep -En '\.specified-link-card|\.pairing-group-tabs|\.pairing-body|\.combo-editor-card|\.combo-help|\.combo-role|\.combo-candidates|\.combo-actions|\.drink-link-candidates' pages/order/page.css; then
            echo 'Pairing Modal legacy selectors still exist in page.css'
            exit 1
          fi
      - name: Component ownership audit
        run: node scripts/audit-component-ownership.mjs
      - name: AI context validation
        run: node scripts/validate-ai-context.mjs
      - name: Full Node regression
        run: node --test tests/*.test.mjs
      - name: Install browser QA dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start SMT static QA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/smt-http.log 2>&1 &
          echo $! >/tmp/smt-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/smt-http.log
          exit 1
      - name: Browser regression by spec
        run: |
          set +e
          failures=0
          specs=(
            tests/responsive-profile.spec.js
            tests/responsive-shell.spec.js
            tests/responsive-order.spec.js
            tests/responsive-checkout.spec.js
            tests/responsive-secondary-pages.spec.js
            tests/responsive-architecture-guard.spec.js
            tests/stress-responsive-matrix.spec.js
            tests/dev-preview.spec.js
            tests/responsive-visual-contract.spec.js
            tests/proportional-layout.spec.js
          )
          for spec in "${specs[@]}"; do
            echo "===== RUN $spec ====="
            timeout --signal=TERM --kill-after=15s 180s npx playwright test "$spec" --reporter=line
            status=$?
            if [ $status -eq 124 ] || [ $status -eq 137 ]; then
              echo "TIMEOUT $spec"
              failures=$((failures+1))
            elif [ $status -ne 0 ]; then
              echo "FAIL $spec"
              failures=$((failures+1))
            else
              echo "PASS $spec"
            fi
          done
          echo "Browser regression failures: $failures"
          test $failures -eq 0
      - name: Confirm clean verified head
        run: |
          if ! git diff --quiet; then
            echo 'Verified Pairing cleanup head must be clean before merge.'
            git diff -- pages/order/page.css tests/order-edit-flow.test.mjs
            exit 1
          fi
