name: SMT Functional Core Verify

on:
  push:
    branches:
      - smt-functional-completeness-v1
    paths:
      - .github/workflows/smt-functional-core-verify.yml

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
          fetch-depth: 0

      - name: Enforce normal empty-order takeaway default
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/order/page.js')
          s = p.read_text()
          old = "const initialOrderServiceMode=resolveInitialOrderServiceMode(initialDineContext,saved?.orderServiceMode);"
          new = "const initialOrderServiceMode=resolveInitialOrderServiceMode(initialDineContext,initialCart.length?saved?.orderServiceMode:SERVICE_TAKEAWAY);"
          if old not in s and new not in s:
              raise SystemExit('expected initial service-mode core line not found')
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)

          html = Path('pages/order/index.html')
          h = html.read_text()
          h = h.replace('page.js?v=order-core-v4', 'page.js?v=order-core-v5')
          html.write_text(h)
          PY

      - name: Run cart and checkout core regression tests
        run: |
          node tests/order-cart-domain.test.mjs
          node tests/cart-checkout-regression-v2.test.mjs

      - name: Commit finalized core if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/order/page.js pages/order/index.html
          git commit -m 'fix(order): keep ordinary empty orders defaulted to takeaway'
          git push origin HEAD:smt-functional-completeness-v1
