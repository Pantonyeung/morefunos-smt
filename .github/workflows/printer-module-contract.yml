name: Printer Module Contract

on:
  pull_request:
    branches: [smt-functional-completeness-v1]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [printer-transport-settings-v1]
    paths:
      - '.github/workflows/printer-module-contract.yml'
      - 'pages/more/print-domain.js'
      - 'pages/more/printer-*.js'
      - 'tests/printer-*.test.mjs'

permissions:
  contents: write

jobs:
  printer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated Printer module contracts
        run: |
          set -euo pipefail
          node --test \
            tests/printer-transport-settings.test.mjs \
            tests/printer-media-profile.test.mjs \
            tests/printer-driver-profile.test.mjs \
            tests/printer-rendered-asset.test.mjs \
            tests/printer-command-renderer.test.mjs \
            tests/printer-template-layout.test.mjs \
            tests/printer-browser-rasterizer.test.mjs \
            tests/printer-render-pipeline.test.mjs \
            tests/printer-job-payload.test.mjs \
            tests/printer-domain-authority.test.mjs \
            tests/printer-routing.test.mjs \
            tests/printer-settings-model.test.mjs \
            tests/printer-settings-ui-model.test.mjs \
            tests/printer-settings-controller.test.mjs \
            tests/printer-settings-renderer.test.mjs
      - name: Publish Printer result marker
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='.github/printer-contract-last-result.txt';
            const branch='printer-transport-settings-v1';
            const body=[`status=${process.env.JOB_STATUS}`,`run_id=${context.runId}`,`sha=${context.sha}`,`updated_at=${new Date().toISOString()}`,''].join('\n');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,message:`ci(printer): record ${process.env.JOB_STATUS}`,content:Buffer.from(body).toString('base64'),sha});