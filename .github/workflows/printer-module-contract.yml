name: Printer Module Contract

on:
  pull_request:
    branches:
      - smt-functional-completeness-v1
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  printer-contract:
    if: startsWith(github.head_ref, 'printer-transport-settings')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Printer transport contract
        run: node --test tests/printer-transport-settings.test.mjs
      - name: Printer media contract
        run: node --test tests/printer-media-profile.test.mjs
      - name: Printer driver profile contract
        run: node --test tests/printer-driver-profile.test.mjs
      - name: Printer rendered asset contract
        run: node --test tests/printer-rendered-asset.test.mjs
      - name: Printer command renderer contract
        run: node --test tests/printer-command-renderer.test.mjs
      - name: Printer job payload contract
        run: node --test tests/printer-job-payload.test.mjs
      - name: Print Domain authority contract
        run: node --test tests/printer-domain-authority.test.mjs
      - name: Printer routing contract
        run: node tests/printer-routing.test.mjs
      - name: Five-printer settings contract
        run: node --test tests/printer-settings-model.test.mjs
      - name: Printer settings UI model contract
        run: node --test tests/printer-settings-ui-model.test.mjs
      - name: Printer settings controller contract
        run: node --test tests/printer-settings-controller.test.mjs
      - name: Printer settings renderer contract
        run: node --test tests/printer-settings-renderer.test.mjs
      - name: Full Node regression by file
        shell: bash
        run: |
          set +e
          failures=0
          : > /tmp/node-regression-summary.txt
          for file in tests/*.test.mjs; do
            echo "===== RUN $file ====="
            node --test "$file"
            status=$?
            if [ $status -ne 0 ]; then
              echo "FAIL $file exit=$status" | tee -a /tmp/node-regression-summary.txt
              failures=$((failures+1))
            else
              echo "PASS $file" | tee -a /tmp/node-regression-summary.txt
            fi
          done
          echo "Node regression failures: $failures" | tee -a /tmp/node-regression-summary.txt
          cat /tmp/node-regression-summary.txt
          test $failures -eq 0
