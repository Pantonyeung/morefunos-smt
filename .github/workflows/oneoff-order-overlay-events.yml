name: oneoff-order-overlay-events

on:
  push:
    branches:
      - smt-functional-completeness-v1
    paths:
      - .github/workflows/oneoff-order-overlay-events.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Emit order overlay state from render lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('pages/order/page.js')
          text=path.read_text()
          old="  requestAnimationFrame(()=>{positionActiveCard();restoreCartViewport(state,previousScroll);});\n}"
          new="  requestAnimationFrame(()=>{positionActiveCard();restoreCartViewport(state,previousScroll);});\n  window.parent?.postMessage?.({type:'morefun:overlay-state',open:Boolean(modal||confirmState)},'*');\n}"
          if old not in text:
            raise SystemExit('render lifecycle target not found')
          path.write_text(text.replace(old,new,1))
          PY
      - name: Verify event-driven overlay signal
        run: |
          grep -q "morefun:overlay-state" pages/order/page.js
      - name: Commit migration
        run: |
          git config user.name "morefun-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/order/page.js
          git commit -m "perf(order): report overlay state without shell DOM observer" || exit 0
          git push origin HEAD:smt-functional-completeness-v1