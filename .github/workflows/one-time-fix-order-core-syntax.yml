name: One-time repair order core syntax

on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/one-time-fix-order-core-syntax.yml']

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair and verify
        shell: python
        run: |
          from pathlib import Path
          p=Path('pages/order/page.js')
          s=p.read_text()
          bad='function optionButtons(function optionButtons(group,values,selected,multi=false)'
          good='function optionButtons(group,values,selected,multi=false)'
          if bad not in s:
              raise SystemExit('expected syntax defect not found')
          s=s.replace(bad,good,1)
          p.write_text(s)
          Path('.github/workflows/one-time-fix-order-core-syntax.yml').unlink()
      - name: Syntax check
        run: node --check pages/order/page.js
      - name: Contract markers
        run: |
          grep -q "requiredTargets" pages/order/page.js
          grep -q "applyRequiredGroup" pages/order/page.js
          ! grep -q "apply-bulk" pages/order/page.js
          ! grep -q "bulkOptionModal" pages/order/page.js
      - name: Commit repaired core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/order/page.js .github/workflows/one-time-fix-order-core-syntax.yml
          git commit -m "fix(order): repair required completion core syntax"
          git push origin HEAD:smt-functional-completeness-v1
