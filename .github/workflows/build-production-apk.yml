name: Build Production APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Android host source ref to build
        required: true
        default: d-line-production-integration-v1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate signing secrets
        env:
          WEB_SIGNING_KEY_B64: ${{ secrets.MOREFUN_RELEASE_PRIVATE_KEY_B64 }}
          KEYSTORE_B64: ${{ secrets.MOREFUN_ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.MOREFUN_ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.MOREFUN_ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.MOREFUN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$WEB_SIGNING_KEY_B64" "$KEYSTORE_B64" "$KEY_ALIAS" "$STORE_PASS" "$KEY_PASS"; do
            test -n "$value" || { echo 'Missing production signing secret'; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run D-line production preflight
        run: bash android/verify-production-integration.sh

      - name: Derive embedded Web Release public key
        env:
          WEB_SIGNING_KEY_B64: ${{ secrets.MOREFUN_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          CLEAN_WEB_KEY="$(printf '%s' "$WEB_SIGNING_KEY_B64" | tr -d '[:space:]')"
          printf '%s' "$CLEAN_WEB_KEY" | base64 -d > /tmp/morefun-web-release-private.pem
          chmod 600 /tmp/morefun-web-release-private.pem
          openssl pkey -in /tmp/morefun-web-release-private.pem -pubout -outform DER | base64 -w0 > /tmp/morefun-web-release-public.b64
          test -s /tmp/morefun-web-release-public.b64
          rm -f /tmp/morefun-web-release-private.pem

      - name: Build release APK with pinned updater key
        run: |
          set -euo pipefail
          PUBLIC_KEY_B64="$(cat /tmp/morefun-web-release-public.b64)"
          gradle -p android :app:assembleRelease --stacktrace --no-daemon \
            -PmorefunReleasePublicKeyB64="$PUBLIC_KEY_B64" \
            -PmorefunReleaseHosts="raw.githubusercontent.com" \
            -PmorefunReleaseManifestUrl="https://raw.githubusercontent.com/Pantonyeung/morefunos-smt/runtime-stable/releases/stable-envelope.json"
          rm -f /tmp/morefun-web-release-public.b64

      - name: Decode and verify persistent Android keystore
        env:
          KEYSTORE_B64: ${{ secrets.MOREFUN_ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.MOREFUN_ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.MOREFUN_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          CLEAN_KEYSTORE="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          printf '%s' "$CLEAN_KEYSTORE" | base64 -d > /tmp/morefun-release.jks
          test -s /tmp/morefun-release.jks
          keytool -list -keystore /tmp/morefun-release.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Sign and verify production APK
        env:
          KEY_ALIAS: ${{ secrets.MOREFUN_ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.MOREFUN_ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.MOREFUN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          UNSIGNED="$OUT/app-release-unsigned.apk"
          SIGNED="$OUT/morefun-smt-production.apk"
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/morefun-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED" | tee "$OUT/morefun-smt-production.signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$SIGNED" | tee "$OUT/morefun-smt-production.badging.txt"
          grep -Fq "package: name='hk.morefun.smt'" "$OUT/morefun-smt-production.badging.txt"
          grep -Fq "sdkVersion:'23'" "$OUT/morefun-smt-production.badging.txt"
          rm -f /tmp/morefun-release.jks

      - name: Produce immutable release manifest
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          cd "$OUT"
          sha256sum morefun-smt-production.apk | tee morefun-smt-production.apk.sha256
          test -s morefun-smt-production.apk
          export APK_SHA="$(awk '{print $1}' morefun-smt-production.apk.sha256)"
          export APK_BYTES="$(wc -c < morefun-smt-production.apk)"
          python3 - <<'PY'
          import json, os
          manifest = {
            "artifact": "morefun-smt-production.apk",
            "sha256": os.environ["APK_SHA"],
            "bytes": int(os.environ["APK_BYTES"]),
            "applicationId": "hk.morefun.smt",
            "minSdk": 23,
            "sourceRef": os.environ["SOURCE_REF"],
            "sourceSha": os.environ["SOURCE_SHA"],
            "workflowRunId": os.environ["RUN_ID"]
          }
          with open("morefun-smt-production.release.json", "w", encoding="utf-8") as f:
            json.dump(manifest, f, ensure_ascii=False, separators=(",", ":"))
          PY
          python3 -m json.tool morefun-smt-production.release.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: morefun-smt-production-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/morefun-smt-production.apk
            android/app/build/outputs/apk/release/morefun-smt-production.apk.sha256
            android/app/build/outputs/apk/release/morefun-smt-production.badging.txt
            android/app/build/outputs/apk/release/morefun-smt-production.signature.txt
            android/app/build/outputs/apk/release/morefun-smt-production.release.json
          if-no-files-found: error
          retention-days: 30
