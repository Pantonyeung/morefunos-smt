name: Apply Required Completion Core
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/apply-required-completion-core.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Patch formal order core
        shell: python
        run: |
          from pathlib import Path

          page = Path('pages/order/page.js')
          css = Path('pages/order/cart.css')
          page_css = Path('pages/order/page.css')
          html = Path('pages/order/index.html')

          text = page.read_text()

          old = '''function cartLineRow(line,index,state){
            const showImages=state.settings.cart.showImages!==false;
            const recent=line.lineId===state.lastAffectedLineId;
            const override=Boolean(line.serviceModeOverride);
            const modeLabel=line.serviceMode===SERVICE_DINE_IN?'堂':'外';
            return '<article class="cart-row '+(showImages?'':'no-image')+' '+(recent?'is-recent':'')+'" data-line-id="'+escapeHtml(line.lineId)+'"><span class="seq">'+(index+1)+'</span>'+(showImages?imageBlock(line.image,line.name,'cart-img'):'')+'<span class="cart-copy"><strong>'+escapeHtml(line.name)+'</strong><small>'+escapeHtml(describe(line))+'</small><span class="service-mode"><button class="line-service-toggle '+(override?'is-override':'')+'" data-action="toggle-line-service" data-id="'+escapeHtml(line.lineId)+'" aria-label="切換'+escapeHtml(line.name)+'堂食外賣">'+modeLabel+'</button>'+(recent?'<em class="recent-badge">剛加入</em>':'')+'</span></span><b class="cart-price">'+money(line.total)+'</b><span class="cart-actions"><button data-action="cart-qty" data-id="'+line.lineId+'" data-delta="-1">−</button><strong>'+line.qty+'</strong><button data-action="cart-qty" data-id="'+line.lineId+'" data-delta="1">＋</button><button class="edit-button" data-action="edit-line" data-id="'+line.lineId+'">修改</button></span></article>';
          }'''
          new = '''function cartLineRow(line,index,state){
            const showImages=state.settings.cart.showImages!==false;
            const recent=line.lineId===state.lastAffectedLineId;
            const override=Boolean(line.serviceModeOverride);
            const modeLabel=line.serviceMode===SERVICE_DINE_IN?'堂':'外';
            return '<article class="cart-row '+(showImages?'':'no-image')+' '+(recent?'is-recent':'')+'" data-line-id="'+escapeHtml(line.lineId)+'"><span class="cart-line-index"><span class="seq">'+String(index+1).padStart(2,'0')+'</span><button class="line-service-toggle '+(override?'is-override':'')+'" data-action="toggle-line-service" data-id="'+escapeHtml(line.lineId)+'" aria-label="切換'+escapeHtml(line.name)+'堂食外賣">'+modeLabel+'</button></span>'+(showImages?imageBlock(line.image,line.name,'cart-img'):'')+'<span class="cart-copy"><strong>'+escapeHtml(line.name)+'</strong><small>'+escapeHtml(describe(line))+'</small>'+(recent?'<em class="recent-badge">剛加入</em>':'')+'</span><b class="cart-price">'+money(line.total)+'</b><span class="cart-actions"><button data-action="cart-qty" data-id="'+line.lineId+'" data-delta="-1">−</button><strong>'+line.qty+'</strong><button data-action="cart-qty" data-id="'+line.lineId+'" data-delta="1">＋</button><button class="edit-button" data-action="edit-line" data-id="'+line.lineId+'">修改</button></span></article>';
          }'''
          assert old in text, 'cartLineRow signature changed'
          text = text.replace(old,new,1)

          marker = "function bulkOptionModal(){"
          start = text.index(marker)
          end = text.index("\nfunction searchModal()", start)
          replacement = '''function requiredTargets(group){
            const targets=[];
            store.get().cart.forEach((line,lineIndex)=>{
              if(!(line.required||[]).includes(group)||line.options?.[group])return;
              const qty=Math.max(1,Number(line.qty)||1);
              for(let unit=0;unit<qty;unit++)targets.push({key:line.lineId+':'+unit,lineId:line.lineId,unit,lineIndex,name:line.name});
            });
            return targets;
          }
          function bulkOptionModal(){
            const values=optionSets[modal.group]||[];
            const label={rice:'飯底',sauce:'醬汁',snack:'小食'}[modal.group]||'選項';
            const targets=modal.targets||requiredTargets(modal.group);
            const assignments=modal.draft.assignments||{};
            const completed=targets.filter(target=>assignments[target.key]).length;
            const quick=values.length?'<div class="required-quick-fill"><strong>快速全部套用</strong><div>'+values.map(value=>'<button data-action="fill-required-option" data-value="'+escapeHtml(value)+'">全部 '+escapeHtml(value)+'</button>').join('')+'</div></div>':'';
            const rows=targets.map((target,index)=>{const selected=assignments[target.key]||'';return '<article class="required-target '+(selected?'is-complete':'')+'"><header><span><b>'+(index+1)+'</b><strong>'+escapeHtml(target.name)+'</strong></span><em>'+(selected?'已選 '+escapeHtml(selected):'未完成')+'</em></header><div class="required-target-options">'+values.map(value=>'<button data-action="assign-required-option" data-key="'+escapeHtml(target.key)+'" data-value="'+escapeHtml(value)+'" class="'+(selected===value?'selected':'')+'">'+escapeHtml(value)+'</button>').join('')+'</div></article>';}).join('');
            return '<aside class="completion-card modal-card required-assignment-card"><header><div><small>必須完成｜會阻止結帳</small><strong>快速補選｜'+label+'</strong></div><button data-action="dismiss-modal">×</button></header><div class="required-assignment-body"><div class="required-assignment-progress"><span>尚欠 '+targets.length+' 份</span><strong>已完成 '+completed+' / '+targets.length+'</strong></div>'+quick+'<div class="required-target-list">'+rows+'</div></div><footer class="required-assignment-actions"><button data-action="back-to-completion">返回整理</button><button class="primary" data-action="apply-bulk" '+(targets.length&&completed===targets.length?'':'disabled')+'>確認套用 '+completed+' 份</button></footer></aside>';
          }
          function applyRequiredAssignments(group,targets,assignments){
            store.set(state=>{
              const next=[];
              state.cart.forEach(line=>{
                const lineTargets=targets.filter(target=>target.lineId===line.lineId);
                if(!lineTargets.length){next.push(line);return;}
                const choices=Array.from({length:Math.max(1,Number(line.qty)||1)},(_,unit)=>assignments[line.lineId+':'+unit]||line.options?.[group]||'');
                if(choices.some(choice=>!choice)){next.push(line);return;}
                const buckets=[];
                choices.forEach((choice,unit)=>{let bucket=buckets.find(item=>item.choice===choice);if(!bucket){bucket={choice,units:[]};buckets.push(bucket);}bucket.units.push(unit);});
                if(buckets.length===1){next.push({...line,options:{...(line.options||{}),[group]:buckets[0].choice}});return;}
                const perUnitSlots=Number(line.drinkSlots||0)/Math.max(1,Number(line.qty)||1);
                let drinkOffset=0;
                buckets.forEach((bucket,bucketIndex)=>{
                  const qty=bucket.units.length;
                  const slots=Math.round(perUnitSlots*qty);
                  const drinks=(line.drinkAssignments||[]).slice(drinkOffset,drinkOffset+slots);
                  drinkOffset+=slots;
                  next.push({...line,lineId:bucketIndex===0?line.lineId:stableId('line'),qty,total:Number(line.unitPrice||0)*qty,options:{...(line.options||{}),[group]:bucket.choice},drinkSlots:slots,drinkAssignments:drinks,createdOrder:Number(line.createdOrder||0)+bucketIndex*0.0001});
                });
              });
              state.cart=normalizeCart(next,state.orderServiceMode);
              state.lastAffectedLineId='';state.lastMutationKind='';
              return state;
            });
          }'''
          text = text[:start] + replacement + text[end:]

          old = "else if(modal.type==='bulk')modal.draft.value=modal.draft.value===v?'':v;"
          new = "else if(modal.type==='bulk'){const key=button.dataset.key;if(key)modal.draft.assignments[key]=modal.draft.assignments[key]===v?'':v;}"
          assert old in text, 'bulk detail-option branch changed'
          text = text.replace(old,new,1)

          old = "else if(action==='completion-drink')openDrink(button.dataset.id,'global',pendingSummary(store.get().cart).drink,anchorRect(button));"
          new = "else if(action==='completion-drink'){const target=findDrinkTarget(store.get().cart);if(!target){showToast('目前沒有待補飲品');return;}pendingDrinkAssignment={lineId:target.lineId,name:target.name};openDrink(button.dataset.id,'completion',1,null);}"
          assert old in text, 'completion drink action changed'
          text = text.replace(old,new,1)

          old = "else if(action==='complete-group'){const g=button.dataset.group;if(g==='drink'){showToast('請在下方選擇飲品');return;}modal={type:'bulk',group:g,dirty:false,draft:{value:''}};render();}"
          new = "else if(action==='complete-group'){const g=button.dataset.group;if(g==='drink'){showToast('請在中央整理頁逐杯補選飲品');return;}const targets=requiredTargets(g);modal={type:'bulk',group:g,targets,dirty:false,draft:{assignments:{}}};render();}"
          assert old in text, 'complete-group action changed'
          text = text.replace(old,new,1)

          old = "else if(action==='apply-bulk'){const g=modal.group,value=modal.draft.value;store.set(state=>{state.cart=state.cart.map(line=>line.required.includes(g)&&!line.options[g]?{...line,options:{...line.options,[g]:value}}:line);return state;});modal={type:'completion',dirty:false};render();showToast('已統一補選 '+value);}"
          new = "else if(action==='fill-required-option'){const value=button.dataset.value;modal.draft.assignments=Object.fromEntries((modal.targets||[]).map(target=>[target.key,value]));modal.dirty=true;render();}\n  else if(action==='assign-required-option'){const key=button.dataset.key,value=button.dataset.value;if(!key)return;modal.draft.assignments[key]=modal.draft.assignments[key]===value?'':value;modal.dirty=true;render();}\n  else if(action==='back-to-completion'){modal={type:'completion',dirty:false};render();}\n  else if(action==='apply-bulk'){const g=modal.group,targets=modal.targets||[],assignments={...(modal.draft.assignments||{})};if(targets.some(target=>!assignments[target.key])){showToast('請先完成每一份必選項');return;}applyRequiredAssignments(g,targets,assignments);modal={type:'completion',dirty:false};render();showToast('已完成 '+targets.length+' 份必選補選');}"
          assert old in text, 'apply-bulk action changed'
          text = text.replace(old,new,1)

          old = "const groups=draft.groups||[];const total=draft.qty+groups.reduce((n,g)=>n+g.qty,0);\n  return '<aside class=\"modifier-card modal-card\"><header><strong>'+d.name+'</strong>"
          new = "const groups=draft.groups||[];const total=draft.qty+groups.reduce((n,g)=>n+g.qty,0);\n  const requiredWorkflow=modal.context==='completion';\n  const targetLabel=requiredWorkflow&&pendingDrinkAssignment?'｜指定：'+escapeHtml(pendingDrinkAssignment.name):'';\n  return '<aside class=\"modifier-card modal-card '+(requiredWorkflow?'required-drink-workflow':'')+'\"><header><strong>'+d.name+targetLabel+'</strong>"
          assert old in text, 'drink modifier header changed'
          text = text.replace(old,new,1)

          old = "pendingDrinkAssignment=null;modal=null;render();showToast('已補選飲品');"
          new = "pendingDrinkAssignment=null;modal=context==='completion'?{type:'completion',dirty:false}:null;render();showToast('已補選飲品');"
          assert old in text, 'applyDrink tail changed'
          text = text.replace(old,new,1)

          page.write_text(text)

          c = css.read_text()
          c += '''\n/* Formal cart index/service column + required completion workflow */\n.cart-row{grid-template-columns:48px 72px minmax(0,1fr) auto}\n.cart-line-index{width:48px;height:72px;display:grid;grid-template-rows:1fr 1fr;align-items:center;justify-items:center;align-self:center;border-right:1px solid #f0e8e2;padding-right:6px}\n.cart-line-index .seq{width:36px;height:32px;border-radius:10px;font-size:14px}\n.cart-line-index .line-service-toggle{width:36px;height:30px;border:1px solid #ddd1c7;border-radius:9px;background:#f7f3ef;color:#6f5b4f;font-size:13px;font-weight:950}\n.cart-line-index .line-service-toggle.is-override{border-color:#efb18b;background:#fff2e9;color:#b84216}\n.cart-row.no-image{grid-template-columns:48px minmax(0,1fr) auto}\n.required-assignment-card{width:min(980px,76vw);height:min(720px,78vh);left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column}\n.required-assignment-card>header small{display:block;color:var(--orange);font-weight:900;margin-bottom:3px}\n.required-assignment-body{min-height:0;overflow:auto;padding:16px;display:grid;gap:14px;background:#fcfaf8}\n.required-assignment-progress{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}\n.required-quick-fill{padding:12px 14px;border:1px solid #ead9ce;border-radius:12px;background:#fffaf6}.required-quick-fill>div{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.required-quick-fill button{min-height:42px;padding:0 14px;border:1px solid #efc5aa;border-radius:10px;background:#fff;color:#a94b24;font-weight:900}\n.required-target-list{display:grid;gap:10px}.required-target{padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff}.required-target.is-complete{border-color:#ddc2b1;background:#fffaf6}.required-target>header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.required-target>header span{display:flex;gap:9px;align-items:center}.required-target>header b{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#f1e9e3}.required-target>header em{font-style:normal;color:var(--muted);font-weight:850}.required-target.is-complete>header em{color:#b84216}.required-target-options{display:flex;gap:8px;flex-wrap:wrap}.required-target-options button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:900}.required-target-options button.selected{border-color:var(--orange);background:var(--orange-soft);color:#b84216}\n.required-assignment-actions{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:#fff}.required-assignment-actions button{min-height:48px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:900}.required-assignment-actions .primary{justify-self:end;min-width:190px}\n.required-drink-workflow{width:min(760px,68vw);left:50%;top:50%;transform:translate(-50%,-50%)}\n@media(max-width:1366px){.cart-row{grid-template-columns:44px 64px minmax(0,1fr) auto}.cart-line-index{width:44px;height:64px}.cart-line-index .seq{width:34px;height:29px}.cart-line-index .line-service-toggle{width:34px;height:27px}.cart-row.no-image{grid-template-columns:44px minmax(0,1fr) auto}.required-assignment-card{width:min(900px,80vw);height:min(650px,80vh)}}\n'''
          css.write_text(c)

          pc = page_css.read_text()
          pc += '''\n/* Anchored popover pointer core: non-blocking actions stay visually attached to their trigger. */\n.modal-card[data-pointer-side]::before{content:"";position:absolute;z-index:3;width:0;height:0;border:9px solid transparent;pointer-events:none}\n.modal-card[data-pointer-side="top"]::before{top:-18px;left:var(--pointer-x);transform:translateX(-50%);border-bottom-color:#fff}\n.modal-card[data-pointer-side="bottom"]::before{bottom:-18px;left:var(--pointer-x);transform:translateX(-50%);border-top-color:#fff}\n.modal-card[data-pointer-side="left"]::before{left:-18px;top:var(--pointer-y);transform:translateY(-50%);border-right-color:#fff}\n.modal-card[data-pointer-side="right"]::before{right:-18px;top:var(--pointer-y);transform:translateY(-50%);border-left-color:#fff}\n.completion-card,.required-assignment-card,.required-drink-workflow{--workflow-modal:1}\n'''
          page_css.write_text(pc)

          h = html.read_text()
          h = h.replace('cart.css?v=order-cart-core-v2','cart.css?v=order-cart-core-v3')
          h = h.replace('page.css?v=order-v1-31','page.css?v=order-v1-32')
          h = h.replace('page.js?v=order-core-v5','page.js?v=order-core-v6')
          html.write_text(h)

          print('FORMAL_REQUIRED_COMPLETION_CORE_PATCHED')
      - name: Verify core markers
        run: |
          grep -q 'required-assignment-card' pages/order/page.js
          grep -q 'assign-required-option' pages/order/page.js
          grep -q 'cart-line-index' pages/order/page.js
          grep -q 'data-pointer-side' pages/order/page.css
          grep -q 'order-core-v6' pages/order/index.html
          ! grep -q '統一補.*套用到所有未完成項目' pages/order/page.js
      - name: Commit formal core changes
        run: |
          git config user.name 'MoreFun SMT Core'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/order/page.js pages/order/cart.css pages/order/page.css pages/order/index.html
          git commit -m 'feat(order): add target-specific required completion workflow'
          git push origin HEAD:smt-functional-completeness-v1
