name: qa-browser-responsive
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths:
      - 'package.json'
      - 'playwright.config.cjs'
      - 'tests/**/*.spec.js'
      - 'app-loader.js'
      - 'app-shell.css'
      - 'shared/**/*.css'
      - 'shared/**/*.js'
      - 'pages/order/**'
      - 'pages/orders/**'
      - 'pages/dine/**'
      - 'pages/soldout/**'
      - 'pages/more/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static SMT server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/morefun-smt-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/morefun-smt-http.log
          exit 1
      - name: Run responsive browser matrix
        run: npm run qa:browser
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsive-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
