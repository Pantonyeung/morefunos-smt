name: qa-runtime-phase3
on:
  workflow_call:
  push:
    branches: [smt-functional-completeness-v1]
    paths:
      - '.github/workflows/qa-runtime-phase3.yml'
      - 'package.json'
      - 'playwright.config.cjs'
      - 'scripts/audit-component-ownership.mjs'
      - 'tests/**.test.mjs'
      - 'tests/**/*.spec.js'
      - 'app-loader.js'
      - 'app-shell.css'
      - 'pages/order/**'
      - 'pages/orders/**'
      - 'pages/dine/**'
      - 'pages/soldout/**'
      - 'pages/more/**'
      - 'shared/**/*.css'
      - 'shared/**/*.js'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        id: npm_setup
        continue-on-error: true
        run: npm install --no-package-lock
      - name: Install Chromium
        id: browser_setup
        if: always() && steps.npm_setup.outcome == 'success'
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Start static SMT server
        id: server_setup
        if: always()
        continue-on-error: true
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/morefun-smt-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/morefun-smt-http.log
          exit 1
      - name: Run and record full regression suite
        if: always()
        shell: bash
        env:
          NPM_SETUP_OUTCOME: ${{ steps.npm_setup.outcome }}
          BROWSER_SETUP_OUTCOME: ${{ steps.browser_setup.outcome }}
          SERVER_SETUP_OUTCOME: ${{ steps.server_setup.outcome }}
        run: |
          set +e
          mkdir -p docs/qa
          {
            echo '# SMT Runtime Phase 3 QA'
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo
            echo '## QA environment setup'
            echo '```text'
            echo "NPM_SETUP_OUTCOME=$NPM_SETUP_OUTCOME"
            echo "BROWSER_SETUP_OUTCOME=$BROWSER_SETUP_OUTCOME"
            echo "SERVER_SETUP_OUTCOME=$SERVER_SETUP_OUTCOME"
            echo '```'
            echo
            echo '## component ownership audit'
            echo '```text'
            node scripts/audit-component-ownership.mjs
            AUDIT_STATUS=$?
            echo '```'
            echo
            echo '## node --test tests/*.test.mjs'
            echo '```text'
            node --test tests/*.test.mjs
            TEST_STATUS=$?
            echo '```'
            echo
            echo '## Syntax checks'
            echo '```text'
            SYNTAX_STATUS=0
            for f in app-loader.js shared/runtime.js shared/adaptive-layout.js shared/page-bridge.js pages/order/page.js pages/order/order-domain.js pages/order/menu-api.js pages/checkout/page.js; do
              echo "> node --check $f"
              node --check "$f" || SYNTAX_STATUS=1
            done
            echo '```'
            echo
            NPM_STATUS=1
            BROWSER_INSTALL_STATUS=1
            SERVER_STATUS=1
            [ "$NPM_SETUP_OUTCOME" = 'success' ] && NPM_STATUS=0
            [ "$BROWSER_SETUP_OUTCOME" = 'success' ] && BROWSER_INSTALL_STATUS=0
            [ "$SERVER_SETUP_OUTCOME" = 'success' ] && SERVER_STATUS=0
            echo '## Playwright responsive browser matrix'
            echo '```text'
            BROWSER_STATUS=1
            if [ "$NPM_STATUS" -eq 0 ] && [ "$BROWSER_INSTALL_STATUS" -eq 0 ] && [ "$SERVER_STATUS" -eq 0 ]; then
              npm run qa:browser
              BROWSER_STATUS=$?
            else
              echo 'Browser matrix skipped because QA environment setup did not complete.'
            fi
            echo '```'
            echo
            echo "NPM_STATUS=$NPM_STATUS"
            echo "BROWSER_INSTALL_STATUS=$BROWSER_INSTALL_STATUS"
            echo "SERVER_STATUS=$SERVER_STATUS"
            echo "AUDIT_STATUS=$AUDIT_STATUS"
            echo "TEST_STATUS=$TEST_STATUS"
            echo "SYNTAX_STATUS=$SYNTAX_STATUS"
            echo "BROWSER_STATUS=$BROWSER_STATUS"
            if [ "$NPM_STATUS" -eq 0 ] && [ "$BROWSER_INSTALL_STATUS" -eq 0 ] && [ "$SERVER_STATUS" -eq 0 ] && [ "$AUDIT_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ] && [ "$SYNTAX_STATUS" -eq 0 ] && [ "$BROWSER_STATUS" -eq 0 ]; then
              echo 'RESULT=PASS'
            else
              echo 'RESULT=FAIL'
            fi
          } > docs/qa/SMT_RUNTIME_PHASE3_QA.md 2>&1
          cat docs/qa/SMT_RUNTIME_PHASE3_QA.md
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsive-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit QA report
        if: always()
        run: |
          git config user.name morefun-qa-bot
          git config user.email actions@users.noreply.github.com
          git add docs/qa/SMT_RUNTIME_PHASE3_QA.md
          git commit -m 'test(runtime): record phase 3 regression results' || true
          git push origin HEAD:smt-functional-completeness-v1
      - name: Enforce final QA result
        if: always()
        run: grep -q '^RESULT=PASS$' docs/qa/SMT_RUNTIME_PHASE3_QA.md
