name: qa-runtime-phase3
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths:
      - '.github/workflows/qa-runtime-phase3.yml'
      - 'package.json'
      - 'playwright.config.cjs'
      - 'scripts/audit-component-ownership.mjs'
      - 'tests/**.test.mjs'
      - 'tests/**/*.spec.js'
      - 'app-loader.js'
      - 'app-shell.css'
      - 'pages/order/**'
      - 'pages/orders/**'
      - 'pages/dine/**'
      - 'pages/soldout/**'
      - 'pages/more/**'
      - 'shared/**/*.css'
      - 'shared/**/*.js'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static SMT server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/morefun-smt-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/morefun-smt-http.log
          exit 1
      - name: Enforce component ownership boundaries
        run: node scripts/audit-component-ownership.mjs
      - name: Run full regression suite
        shell: bash
        run: |
          set +e
          mkdir -p docs/qa
          {
            echo '# SMT Runtime Phase 3 QA'
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo
            echo '## component ownership audit'
            echo '```text'
            node scripts/audit-component-ownership.mjs
            AUDIT_STATUS=$?
            echo '```'
            echo
            echo '## node --test tests/*.test.mjs'
            echo '```text'
            node --test tests/*.test.mjs
            TEST_STATUS=$?
            echo '```'
            echo
            echo '## Syntax checks'
            echo '```text'
            SYNTAX_STATUS=0
            for f in app-loader.js shared/runtime.js shared/adaptive-layout.js shared/page-bridge.js pages/order/page.js pages/order/order-domain.js pages/order/menu-api.js pages/checkout/page.js; do
              echo "> node --check $f"
              node --check "$f" || SYNTAX_STATUS=1
            done
            echo '```'
            echo
            echo '## Playwright responsive browser matrix'
            echo '```text'
            npm run qa:browser
            BROWSER_STATUS=$?
            echo '```'
            echo
            echo "AUDIT_STATUS=$AUDIT_STATUS"
            echo "TEST_STATUS=$TEST_STATUS"
            echo "SYNTAX_STATUS=$SYNTAX_STATUS"
            echo "BROWSER_STATUS=$BROWSER_STATUS"
            if [ "$AUDIT_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ] && [ "$SYNTAX_STATUS" -eq 0 ] && [ "$BROWSER_STATUS" -eq 0 ]; then
              echo 'RESULT=PASS'
            else
              echo 'RESULT=FAIL'
            fi
          } > docs/qa/SMT_RUNTIME_PHASE3_QA.md 2>&1
          cat docs/qa/SMT_RUNTIME_PHASE3_QA.md
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsive-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit QA report
        if: always()
        run: |
          git config user.name morefun-qa-bot
          git config user.email actions@users.noreply.github.com
          git add docs/qa/SMT_RUNTIME_PHASE3_QA.md
          git commit -m 'test(runtime): record phase 3 regression results' || true
          git push origin HEAD:smt-functional-completeness-v1
      - name: Enforce final QA result
        if: always()
        run: grep -q '^RESULT=PASS$' docs/qa/SMT_RUNTIME_PHASE3_QA.md
