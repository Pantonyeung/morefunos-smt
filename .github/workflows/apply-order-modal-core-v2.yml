name: Apply Order Modal Core V2
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/apply-order-modal-core-v2.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Migrate order modal, cart identity and required workflow core
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} pattern not found')
              return text.replace(old, new, 1)

          # --- Order runtime core ---
          p=Path('pages/order/page.js')
          s=p.read_text()

          s=replace_once(s,
          "function modalScrim(){return modal?'<div class=\"modal-scrim\" aria-hidden=\"true\"></div>':'';}",
          "function modalScrim(){return modal?'<button class=\"modal-scrim\" data-action=\"dismiss-modal\" aria-label=\"關閉彈窗\"></button>':'';}",
          'modal scrim')

          old="""function completionDraft(group=''){
  const current=modal?.draft||{};
  if(!group)return {...current,activeGroup:'',activeTarget:'',assignments:current.assignments||{}};
  const targets=requiredTargets(store.get().cart,group),assignments=current.activeGroup===group?(current.assignments||{}):{};
  const activeTarget=(current.activeGroup===group&&targets.some(target=>target.id===current.activeTarget))?current.activeTarget:(targets.find(target=>!assignments[target.id])?.id||targets[0]?.id||'');
  return {activeGroup:group,activeTarget,assignments};
}"""
          new="""function completionDraft(group=''){
  const current=modal?.draft||{};
  if(!group)return {...current,activeGroup:'',activeTarget:'',assignments:current.assignments||{},assignMode:current.assignMode||'quick'};
  const targets=requiredTargets(store.get().cart,group),assignments=current.activeGroup===group?(current.assignments||{}):{};
  const activeTarget=(current.activeGroup===group&&targets.some(target=>target.id===current.activeTarget))?current.activeTarget:(targets.find(target=>!assignments[target.id])?.id||targets[0]?.id||'');
  return {activeGroup:group,activeTarget,assignments,assignMode:current.activeGroup===group?(current.assignMode||'quick'):'quick'};
}"""
          s=replace_once(s,old,new,'completion draft')

          start=s.index('function requiredSelectionPanel(group){')
          end=s.index('function splitLineForRequired', start)
          new_panel="""function requiredSelectionPanel(group){
  const draft=completionDraft(group);modal.draft=draft;
  const targets=requiredTargets(store.get().cart,group),assignments=draft.assignments||{},active=targets.find(target=>target.id===draft.activeTarget)||targets[0];
  const done=targets.filter(target=>assignments[target.id]).length,label=requiredGroupLabel(group);
  const targetHtml=targets.map(target=>'<button class=\"required-target '+(target.id===active?.id?'active ':'')+(assignments[target.id]?'complete':'')+'\" data-action=\"completion-target\" data-id=\"'+escapeHtml(target.id)+'\"><span><b>'+completionTargetLabel(target)+'</b><small>'+(assignments[target.id]?'已選：'+escapeHtml(group==='drink'?(drinkMap.get(assignments[target.id])?.name||assignments[target.id]):assignments[target.id]):'尚未選擇')+'</small></span><em>'+(assignments[target.id]?'✓':'待選')+'</em></button>').join('');
  let choices='';
  if(group==='drink')choices='<div class=\"required-drink-grid\">'+drinks.filter(item=>item.available!==false).map(item=>'<button data-action=\"completion-required-choice\" data-value=\"'+escapeHtml(item.id)+'\" class=\"'+(active&&assignments[active.id]===item.id?'selected':'')+'\">'+imageBlock(item.image,item.name,'required-choice-img')+'<span>'+escapeHtml(item.name)+'</span></button>').join('')+'</div>';
  else choices='<div class=\"required-option-grid\">'+(optionSets[group]||[]).map(value=>'<button data-action=\"completion-required-choice\" data-value=\"'+escapeHtml(value)+'\" class=\"'+(active&&assignments[active.id]===value?'selected':'')+'\">'+escapeHtml(value)+'</button>').join('')+'</div>';
  const selected=active?assignments[active.id]:'';
  const modeSwitch=group==='drink'?'<div class=\"required-assign-mode\"><button data-action=\"completion-assign-mode\" data-value=\"quick\" class=\"'+(draft.assignMode!=='specified'?'active':'')+'\"><strong>快速順序</strong><small>直接連續揀飲品，自動去下一份</small></button><button data-action=\"completion-assign-mode\" data-value=\"specified\" class=\"'+(draft.assignMode==='specified'?'active':'')+'\"><strong>指定配對</strong><small>先揀左邊餐點，再指定飲品</small></button></div>':'';
  const helper=group==='drink'?(draft.assignMode==='specified'?'指定配對：先揀左邊餐點，再揀飲品；已配對項目可以重新指定。':'快速順序：只需連續揀飲品，系統按未完成餐點順序逐份配對。'):'每一份都會顯示指定結果，避免配錯餐點。';
  return '<div class=\"required-workflow-head\"><div><small>必須完成｜'+label+'</small><strong>已分配 '+done+' / '+targets.length+'</strong><span>'+helper+'</span></div><button data-action=\"completion-back\">返回必選總覽</button></div>'+modeSwitch+'<div class=\"required-workflow-grid\"><section class=\"required-target-pane\"><h3>要補選嘅餐點</h3><div class=\"required-target-list\">'+targetHtml+'</div></section><section class=\"required-choice-pane\"><div class=\"required-active-target\"><small>目前指定</small><strong>'+(active?completionTargetLabel(active):'已完成')+'</strong><span>'+(selected?'目前：'+escapeHtml(group==='drink'?(drinkMap.get(selected)?.name||selected):selected):'請選擇 '+label)+'</span></div>'+choices+(selected&&done<targets.length&&group!=='drink'?'<button class=\"required-fill\" data-action=\"completion-fill-remaining\" data-value=\"'+escapeHtml(selected)+'\">其餘未選全部用同一選項</button>':'')+'</section></div><footer class=\"required-workflow-actions\"><button data-action=\"completion-back\">返回</button><button class=\"primary\" data-action=\"apply-required-group\" '+(done===targets.length&&targets.length?'':'disabled')+'>確認 '+label+'｜'+done+' 份</button></footer>';
}
"""
          s=s[:start]+new_panel+s[end:]

          old_confirm="""  const dissolve=confirmState.kind==='dissolve',dineCancel=confirmState.kind==='dine-cancel';
  return notice+'<div class=\"confirm-layer\"><section class=\"confirm-card\"><strong>'+confirmState.title+'</strong><p>'+confirmState.message+'</p><div><button data-action=\"confirm-cancel\">'+(dissolve?'返回套餐':dineCancel?'繼續點單':'繼續修改')+'</button><button class=\"danger\" data-action=\"'+(dissolve?'confirm-dissolve':dineCancel?'confirm-dine-cancel':'confirm-discard')+'\">'+(dissolve?'確認拆開':dineCancel?'取消今次點單':'放棄修改')+'</button></div></section></div>';"""
          new_confirm="""  const dissolve=confirmState.kind==='dissolve',dineCancel=confirmState.kind==='dine-cancel',modalExit=confirmState.kind==='modal-exit';
  if(modalExit)return notice+'<div class=\"confirm-layer\"><section class=\"confirm-card\"><strong>'+confirmState.title+'</strong><p>'+confirmState.message+'</p><div class=\"modal-exit-actions\"><button data-action=\"confirm-cancel\">繼續調整</button><button class=\"danger\" data-action=\"confirm-discard-modal\">退出不保存</button><button class=\"primary\" data-action=\"confirm-save-modal\">保存並退出</button></div></section></div>';
  return notice+'<div class=\"confirm-layer\"><section class=\"confirm-card\"><strong>'+confirmState.title+'</strong><p>'+confirmState.message+'</p><div><button data-action=\"confirm-cancel\">'+(dissolve?'返回套餐':dineCancel?'繼續點單':'繼續修改')+'</button><button class=\"danger\" data-action=\"'+(dissolve?'confirm-dissolve':dineCancel?'confirm-dine-cancel':'confirm-discard')+'\">'+(dissolve?'確認拆開':dineCancel?'取消今次點單':'放棄修改')+'</button></div></section></div>';"""
          s=replace_once(s,old_confirm,new_confirm,'confirm card')

          old_dismiss="""function markDirty(){if(modal)modal.dirty=true;}
function requestDismiss(){
  if(!modal)return;
  if(modal.dirty&&['product','drink'].includes(modal.type)){confirmState={title:'尚未套用修改',message:'返回後今次選擇將不會保存。',returnModal:modal.type==='drink'&&modal.parent?modal.parent:null};render();return;}
  modal=modal.type==='drink'&&modal.parent?modal.parent:null;confirmState=null;render();
}"""
          new_dismiss="""function markDirty(){if(modal)modal.dirty=true;}
function captureModalSnapshot(){const state=store.get();return {settings:safeClone(state.settings),quickMode:Boolean(state.quickMode),operations:safeClone(state.operations)};}
function restoreModalSnapshot(snapshot){
  if(!snapshot)return;
  store.set(state=>({...state,settings:safeClone(snapshot.settings||state.settings),quickMode:Boolean(snapshot.quickMode),operations:safeClone(snapshot.operations||state.operations)}));
  if(snapshot.settings){const persisted=readJSON(SETTINGS_STORAGE_KEY,{})||{};writeJSON(SETTINGS_STORAGE_KEY,{...persisted,...safeClone(snapshot.settings),cartViewMode:store.get().cartViewMode});}
}
function requestDismiss(){
  if(!modal)return;
  if(modal.dirty){confirmState={kind:'modal-exit',title:'已經有調整，是否退出？',message:'你可以繼續調整、退出而不保存，或者保存目前修改後退出。',returnModal:modal};render();return;}
  modal=modal.type==='drink'&&modal.parent?modal.parent:null;confirmState=null;render();
}
function saveAndCloseModal(){
  if(!modal)return;
  const actionByType={product:'apply-product',drink:'apply-drink',combo:'apply-combo-edit','specified-link':'apply-specified-link'};
  if(modal.type==='completion'&&modal.draft?.activeGroup){const targets=requiredTargets(store.get().cart,modal.draft.activeGroup),assignments=modal.draft.assignments||{};if(targets.some(target=>!assignments[target.id])){confirmState=null;showToast('仲有必選項未完成');render();return;}applyRequiredGroup();modal=null;confirmState=null;render();return;}
  const action=actionByType[modal.type];
  if(action){const button=document.querySelector('[data-action=\"'+action+'\"]');if(!button||button.disabled){confirmState=null;showToast('目前修改未完成，未能保存');render();return;}confirmState=null;handle(button);return;}
  modal=null;confirmState=null;render();
}
function discardAndCloseModal(){const snapshot=confirmState?.returnModal?.snapshot||modal?.snapshot;restoreModalSnapshot(snapshot);modal=null;confirmState=null;render();}"""
          s=replace_once(s,old_dismiss,new_dismiss,'dismiss core')

          # Snapshot immediate-setting popovers.
          s=s.replace("modal={type:'quick',anchor:actionAnchor(button,anchorOverride),dirty:false};render();","modal={type:'quick',anchor:actionAnchor(button,anchorOverride),dirty:false,snapshot:captureModalSnapshot()};render();")
          s=s.replace("modal={type:'settings',anchor:actionAnchor(button,anchorOverride),dirty:false};render();","modal={type:'settings',anchor:actionAnchor(button,anchorOverride),dirty:false,snapshot:captureModalSnapshot()};render();")
          s=s.replace("modal={type:'status',anchor:actionAnchor(button,anchorOverride),dirty:false};render();","modal={type:'status',anchor:actionAnchor(button,anchorOverride),dirty:false,snapshot:captureModalSnapshot()};render();")

          # Modal confirmation actions.
          s=replace_once(s,"else if(action==='confirm-cancel'){confirmState=null;render();}","else if(action==='confirm-cancel'){confirmState=null;render();}\n  else if(action==='confirm-discard-modal')discardAndCloseModal();\n  else if(action==='confirm-save-modal')saveAndCloseModal();",'confirm actions')

          # Required drink modes.
          old_choice="""  else if(action==='completion-target'){modal.draft.activeTarget=button.dataset.id;render();}
  else if(action==='completion-required-choice'){
    const target=modal.draft.activeTarget,value=button.dataset.value;if(!target)return;
    modal.draft.assignments={...(modal.draft.assignments||{}),[target]:value};modal.dirty=true;
    const targets=requiredTargets(store.get().cart,modal.draft.activeGroup),next=targets.find(item=>!modal.draft.assignments[item.id]);if(next)modal.draft.activeTarget=next.id;render();
  }"""
          new_choice="""  else if(action==='completion-target'){modal.draft.activeTarget=button.dataset.id;render();}
  else if(action==='completion-assign-mode'){modal.draft.assignMode=button.dataset.value==='specified'?'specified':'quick';render();}
  else if(action==='completion-required-choice'){
    const target=modal.draft.activeTarget,value=button.dataset.value;if(!target)return;
    modal.draft.assignments={...(modal.draft.assignments||{}),[target]:value};modal.dirty=true;
    if(modal.draft.activeGroup!=='drink'||modal.draft.assignMode!=='specified'){
      const targets=requiredTargets(store.get().cart,modal.draft.activeGroup),next=targets.find(item=>!modal.draft.assignments[item.id]);if(next)modal.draft.activeTarget=next.id;
    }
    render();
  }"""
          s=replace_once(s,old_choice,new_choice,'required drink actions')

          # Mark immediate settings changes as dirty so outside-click confirmation is truthful.
          dirty_actions={
            "else if(action==='move-quick-drink')updateSettings":"else if(action==='move-quick-drink'){markDirty();updateSettings",
            "else if(action==='set-order-mode')store.set":"else if(action==='set-order-mode'){markDirty();store.set",
            "else if(action==='toggle-quick-drink-strip')updateSettings":"else if(action==='toggle-quick-drink-strip'){markDirty();updateSettings",
            "else if(action==='quick-display')updateSettings":"else if(action==='quick-display'){markDirty();updateSettings",
            "else if(action==='toggle-quick-assist')updateSettings":"else if(action==='toggle-quick-assist'){markDirty();updateSettings",
            "else if(action==='setting-card')updateSettings":"else if(action==='setting-card'){markDirty();updateSettings",
            "else if(action==='cart-width')updateSettings":"else if(action==='cart-width'){markDirty();updateSettings",
            "else if(action==='cart-merge')updateSettings":"else if(action==='cart-merge'){markDirty();updateSettings",
            "else if(action==='toggle-cart-images')updateSettings":"else if(action==='toggle-cart-images'){markDirty();updateSettings",
            "else if(action==='toggle-code')updateSettings":"else if(action==='toggle-code'){markDirty();updateSettings",
            "else if(action==='toggle-accepting')store.set":"else if(action==='toggle-accepting'){markDirty();store.set",
          }
          for old,new in dirty_actions.items():
              if old not in s: raise SystemExit('dirty action pattern not found: '+old)
              s=s.replace(old,new,1)
          # Close braces for the one-line branches we wrapped.
          s=s.replace("s.quickDrinks.order=order;});\n  else if(action==='ui-scale')","s.quickDrinks.order=order;});}\n  else if(action==='ui-scale')",1)
          s=s.replace("state=>({...state,quickMode:button.dataset.value==='quick'}));\n  else if(action==='toggle-quick-drink-strip')","state=>({...state,quickMode:button.dataset.value==='quick'}));}\n  else if(action==='toggle-quick-drink-strip')",1)
          s=s.replace("s.quickDrinks.visible=s.quickDrinks.visible===false;});\n  else if(action==='quick-display')","s.quickDrinks.visible=s.quickDrinks.visible===false;});}\n  else if(action==='quick-display')",1)
          s=s.replace("s.quickDrinks.showImages=button.dataset.value==='image';});\n  else if(action==='toggle-quick-assist')","s.quickDrinks.showImages=button.dataset.value==='image';});}\n  else if(action==='toggle-quick-assist')",1)
          s=s.replace("s.quickDrinks.quickAssist=s.quickDrinks.quickAssist===false;});\n  else if(action==='setting-card')","s.quickDrinks.quickAssist=s.quickDrinks.quickAssist===false;});}\n  else if(action==='setting-card')",1)
          s=s.replace("s.catalog.defaultTemplate=button.dataset.value;s.catalog.productOverrides={};});\n  else if(action==='cart-width')","s.catalog.defaultTemplate=button.dataset.value;s.catalog.productOverrides={};});}\n  else if(action==='cart-width')",1)
          s=s.replace("s.cart.widthPercent=Number(button.dataset.value)||32;});\n  else if(action==='cart-merge')","s.cart.widthPercent=Number(button.dataset.value)||32;});}\n  else if(action==='cart-merge')",1)
          s=s.replace("s.cart.mergeMode=button.dataset.value;});\n  else if(action==='toggle-cart-images')","s.cart.mergeMode=button.dataset.value;});}\n  else if(action==='toggle-cart-images')",1)
          s=s.replace("s.cart.showImages=s.cart.showImages===false;});\n  else if(action==='toggle-code')","s.cart.showImages=s.cart.showImages===false;});}\n  else if(action==='toggle-code')",1)
          s=s.replace("s.catalog.showCode=!s.catalog.showCode;});\n  else if(action==='toggle-accepting')","s.catalog.showCode=!s.catalog.showCode;});}\n  else if(action==='toggle-accepting')",1)
          s=s.replace("state.operations.immediateStopped=false;return state;});\n  else if(action==='save-close-time')","state.operations.immediateStopped=false;return state;});}\n  else if(action==='save-close-time')",1)

          p.write_text(s)

          # --- Adaptive layout core: reference cart marker, large required workflow, pointer ---
          p=Path('shared/adaptive-layout.css')
          s=p.read_text()
          s=s.replace('--adaptive-cart-image:72px;','--adaptive-cart-image:72px;\n  --adaptive-cart-seq:30px;',1)
          s=s.replace('grid-template-columns:32px var(--adaptive-cart-image) minmax(0,1fr) auto;','grid-template-columns:var(--adaptive-cart-seq) var(--adaptive-cart-image) minmax(0,1fr) auto;',1)
          anchor='body[data-page="order"] .cart-img{width:var(--adaptive-cart-image);height:var(--adaptive-cart-image)}\n'
          addition='''body[data-page="order"] .cart-row.no-image{grid-template-columns:var(--adaptive-cart-seq) minmax(0,1fr) auto}\nbody[data-page="order"] .seq-service{width:var(--adaptive-cart-seq);height:clamp(36px,calc(var(--adaptive-cart-image) * .62),44px);align-self:center;display:grid;grid-template-rows:minmax(0,1fr) 14px;border:1px solid #e6ddd6;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(69,48,32,.05)}\nbody[data-page="order"] .seq-service .seq{display:grid;place-items:center;width:auto;height:auto;background:transparent;color:#5f554f;font-size:max(11px,calc(12px * var(--readability-scale)));line-height:1;font-weight:900}\nbody[data-page="order"] .seq-service .line-service-toggle{width:100%;min-width:0;height:14px;padding:0;border:0;border-radius:0;background:transparent;color:#d95a24;font-size:max(9px,calc(10px * var(--readability-scale)));line-height:14px;font-weight:950}\nbody[data-page="order"] .seq-service .line-service-toggle.is-override{background:#fff0e7;color:#b84216}\n\n/* Required checkout-blocking work uses a large central decision surface. */\nbody[data-page="order"] .completion-card.required-workflow{width:min(72vw,1380px);height:min(62vh,720px);max-height:calc(100vh - 120px);display:flex;flex-direction:column;overflow:hidden}\nbody[data-page="order"] .required-workflow-grid{grid-template-columns:minmax(240px,29%) minmax(0,71%);flex:1;min-height:0}\nbody[data-page="order"] .required-drink-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow-y:auto;overflow-x:hidden;align-content:start;padding-right:3px}\nbody[data-page="order"] .required-drink-grid button{min-height:112px;grid-template-rows:72px auto;padding:8px}\nbody[data-page="order"] .required-choice-img{width:72px;height:72px}\nbody[data-page="order"] .required-assign-mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 0}\nbody[data-page="order"] .required-assign-mode button{min-height:54px;border:1px solid var(--line);border-radius:11px;background:#fff;display:grid;gap:3px;place-content:center;text-align:center}\nbody[data-page="order"] .required-assign-mode button strong{font-size:15px}\nbody[data-page="order"] .required-assign-mode button small{color:var(--muted)}\nbody[data-page="order"] .required-assign-mode button.active{border-color:#efa778;background:#fff2e9;color:#b84216;box-shadow:inset 0 0 0 1px rgba(239,91,35,.08)}\n\n/* Anchored popovers visibly point back to the control that opened them. */\nbody[data-page="order"] .modal-card[data-pointer-side]{overflow:visible}\nbody[data-page="order"] .modal-card[data-pointer-side]::before{content:"";position:absolute;z-index:5;width:0;height:0;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(50,35,24,.28))}\nbody[data-page="order"] .modal-card[data-pointer-side="top"]::before{top:-18px;bottom:auto;left:var(--pointer-x);right:auto;transform:translateX(-50%);border:9px solid transparent;border-bottom-color:#fff}\nbody[data-page="order"] .modal-card[data-pointer-side="bottom"]::before{bottom:-18px;top:auto;left:var(--pointer-x);right:auto;transform:translateX(-50%);border:9px solid transparent;border-top-color:#fff}\nbody[data-page="order"] .modal-card[data-pointer-side="left"]::before{left:-18px;right:auto;top:var(--pointer-y);bottom:auto;transform:translateY(-50%);border:9px solid transparent;border-right-color:#fff}\nbody[data-page="order"] .modal-card[data-pointer-side="right"]::before{right:-18px;left:auto;top:var(--pointer-y);bottom:auto;transform:translateY(-50%);border:9px solid transparent;border-left-color:#fff}\nbody[data-page="order"] .confirm-card>.modal-exit-actions{grid-template-columns:1fr 1fr 1fr}\n'''
          if anchor not in s: raise SystemExit('adaptive cart image anchor not found')
          s=s.replace(anchor,anchor+addition,1)
          p.write_text(s)

          # --- Adaptive runtime token for the compact reference marker ---
          p=Path('shared/adaptive-layout.js')
          s=p.read_text()
          old="root.style.setProperty('--adaptive-cart-image',`${clamp(72*scale,46,78)}px`);"
          new="root.style.setProperty('--adaptive-cart-image',`${clamp(72*scale,46,78)}px`);\n    root.style.setProperty('--adaptive-cart-seq',`${clamp(30*scale,26,32)}px`);"
          s=replace_once(s,old,new,'adaptive cart seq token')
          p.write_text(s)

          # --- Cache versions ---
          p=Path('pages/order/index.html')
          s=p.read_text()
          s=s.replace('adaptive-layout.css?v=adaptive-proportion-v1','adaptive-layout.css?v=adaptive-proportion-v2')
          s=s.replace('adaptive-layout.js?v=adaptive-proportion-v1','adaptive-layout.js?v=adaptive-proportion-v2')
          s=s.replace('page.js?v=order-core-v7','page.js?v=order-core-v8')
          p.write_text(s)

          # Self-remove migration workflow; final runtime has no migration/patch layer.
          Path('.github/workflows/apply-order-modal-core-v2.yml').unlink()
      - name: Verify no runtime patch files were introduced
        run: |
          test ! -e pages/order/cart-experience.js
          test ! -e pages/order/cart-experience.css
          grep -q 'completion-assign-mode' pages/order/page.js
          grep -q 'modal-exit-actions' pages/order/page.js
          grep -q 'required-drink-grid' shared/adaptive-layout.css
      - name: Commit formal core changes
        run: |
          git config user.name "morefunos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/order/page.js pages/order/index.html shared/adaptive-layout.css shared/adaptive-layout.js .github/workflows/apply-order-modal-core-v2.yml
          git diff --cached --quiet || git commit -m "feat(order): enlarge required workflow and unify modal dismissal core"
          git push
