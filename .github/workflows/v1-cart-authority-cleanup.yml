name: V1 Cart Authority Cleanup

on:
  pull_request:
    branches:
      - smt-functional-completeness-v1
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: v1-cart-authority-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: startsWith(github.head_ref, 'v1-cart-legacy-cleanup') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify cleanup parser contracts
        run: node --test tests/cleanup-order-page-cart-legacy.test.mjs tests/cart-visual-authority.test.mjs

      - name: Apply guarded V1 Cart legacy cleanup
        run: node scripts/cleanup-order-page-cart-legacy.mjs

      - name: Migrate Cart regression assertions to final authority
        run: node scripts/migrate-order-edit-flow-cart-authority.mjs

      - name: Assert V1 legacy selectors are absent
        run: |
          if grep -En '\.cart-row\s*\{|\.cart-img\s*\{|\.cart-actions\s*\{|\.pending-area\s*\{|\.cart[[:space:]]+footer\s*\{' pages/order/page.css; then
            echo 'V1 Cart legacy selectors still exist in page.css'
            exit 1
          fi

      - name: Component ownership audit
        run: node scripts/audit-component-ownership.mjs

      - name: AI context validation
        run: node scripts/validate-ai-context.mjs

      - name: Full Node regression
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > /tmp/v1-cart-node.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -B 5 -A 16 'not ok|AssertionError|ERR_ASSERTION|failureType|error:' /tmp/v1-cart-node.log || tail -n 180 /tmp/v1-cart-node.log
          fi
          exit "$status"

      - name: Commit only verified cleanup output
        run: |
          git config user.name 'MoreFun Cart Authority QA'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/order/page.css tests/order-edit-flow.test.mjs
          if git diff --cached --quiet; then
            echo 'No V1 cleanup change required.'
            exit 0
          fi
          git commit -m 'refactor(order): physically remove V1 cart legacy authority'
          git push origin HEAD:${{ github.head_ref }}
