name: oneoff-runtime-phase3-verify
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/oneoff-runtime-phase3-verify.yml']
permissions:
  contents: write
jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Finalize runtime phase 3
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime=Path('shared/runtime.js')
          t=runtime.read_text()
          old="""  function setTransient(updater){
    const next=typeof updater==='function'?updater(state):updater;
    if(next==null||next===state)return;
    state=next;
    notify();
  }"""
          new="""  function setTransient(updater){
    const draft={...state};
    const next=typeof updater==='function'?updater(draft):updater;
    if(next==null)return;
    state=next;
    notify();
  }"""
          if old not in t: raise SystemExit('setTransient target not found')
          runtime.write_text(t.replace(old,new,1))

          page=Path('pages/order/page.js')
          t=page.read_text()
          old="store.set(state=>({...state,cart:[],draftSession:null,dineContext:null,orderServiceMode:SERVICE_TAKEAWAY,lastAffectedLineId:'',lastMutationKind:''}));modal=null;render();showToast('已正式加入 '+button.dataset.id+' 號枱及建立打印工作');"
          new="store.set(state=>({...state,cart:[],draftSession:null,dineContext:null,orderServiceMode:SERVICE_TAKEAWAY,lastAffectedLineId:'',lastMutationKind:''}));modal=null;queue.afterRender(()=>showToast('已正式加入 '+button.dataset.id+' 號枱及建立打印工作'));"
          if old not in t: raise SystemExit('assign-table duplicate render target not found')
          t=t.replace(old,new,1)

          old="store.set(state=>{state.cart=normalizeCart(dissolveRiceballSet(state.cart,lineId,{idFactory:role=>stableId('line-'+role)}),state.orderServiceMode);state.lastAffectedLineId=state.cart.at(-1)?.lineId||'';state.lastMutationKind='changed';return state;});confirmState=null;modal=null;render();showToast('套餐已拆開並按單品重新計價');"
          new="store.set(state=>{state.cart=normalizeCart(dissolveRiceballSet(state.cart,lineId,{idFactory:role=>stableId('line-'+role)}),state.orderServiceMode);state.lastAffectedLineId=state.cart.at(-1)?.lineId||'';state.lastMutationKind='changed';return state;});confirmState=null;modal=null;queue.afterRender(()=>showToast('套餐已拆開並按單品重新計價'));"
          if old not in t: raise SystemExit('dissolve duplicate render target not found')
          page.write_text(t.replace(old,new,1))
          PY
      - name: Run regression tests
        run: |
          node --test tests/*.test.mjs
      - name: Commit verified runtime phase 3
        run: |
          git config user.name morefun-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add shared/runtime.js pages/order/page.js tests/order-runtime-discipline.test.mjs
          git commit -m 'perf(runtime): finish phase 3 state and render consolidation' || exit 0
          git push origin HEAD:smt-functional-completeness-v1
