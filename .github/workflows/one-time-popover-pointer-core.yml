name: One-time anchored popover pointer core

on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/one-time-popover-pointer-core.yml']

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Complete four-direction pointer styles
        shell: python
        run: |
          from pathlib import Path
          p=Path('pages/order/page.css')
          s=p.read_text()
          marker='''.modal-card[data-pointer-side="right"]::before {
            left: 100%;
            right: auto;
            border-color: transparent;
            border-left-color: #fff;
          }
          '''
          addition='''.modal-card[data-pointer-side="top"]::before {
            top: auto;
            bottom: 100%;
            left: var(--pointer-x, 50%);
            right: auto;
            transform: translateX(-50%);
            border-color: transparent;
            border-bottom-color: #fff;
          }
          .modal-card[data-pointer-side="bottom"]::before {
            top: 100%;
            bottom: auto;
            left: var(--pointer-x, 50%);
            right: auto;
            transform: translateX(-50%);
            border-color: transparent;
            border-top-color: #fff;
          }
          '''
          if marker not in s:
              raise SystemExit('pointer marker not found')
          if 'data-pointer-side="top"' not in s:
              s=s.replace(marker,marker+addition)
          p.write_text(s)
          Path('.github/workflows/one-time-popover-pointer-core.yml').unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/order/page.css .github/workflows/one-time-popover-pointer-core.yml
          git commit -m "fix(order): complete four-direction anchored popover pointers"
          git push origin HEAD:smt-functional-completeness-v1
