name: oneoff-modal-core-consolidation
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/oneoff-modal-core-consolidation.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Consolidate modal lifecycle into order core
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('pages/order/index.html')
          text=index.read_text()
          text=text.replace('    <script src="../../shared/modal-policy.js?v=modal-policy-v1"></script>\n','')
          text=text.replace('page.js?v=order-core-v11','page.js?v=order-core-v12')
          index.write_text(text)

          page=Path('pages/order/page.js')
          text=page.read_text()

          old="""function markDirty(){if(modal)modal.dirty=true;}\nfunction requestDismiss(){\n  if(!modal)return;\n  if(modal.dirty&&['product','drink'].includes(modal.type)){confirmState={title:'尚未套用修改',message:'返回後今次選擇將不會保存。',returnModal:modal.type==='drink'&&modal.parent?modal.parent:null};render();return;}\n  modal=modal.type==='drink'&&modal.parent?modal.parent:null;confirmState=null;render();\n}"""
          new="""function markDirty(){if(modal)modal.dirty=true;}\nfunction modalSaveAction(current=modal){\n  if(!current)return '';\n  if(current.type==='product')return 'apply-product';\n  if(current.type==='drink')return 'apply-drink';\n  if(current.type==='completion'&&current.draft?.activeGroup)return 'apply-required-group';\n  if(current.type==='combo')return 'apply-combo-edit';\n  if(current.type==='specified-link')return 'apply-specified-link';\n  return '';\n}\nfunction requestDismiss(){\n  if(!modal)return;\n  if(modal.dirty){\n    confirmState={kind:'modal-exit',title:'已經有調整，是否退出？',message:'你可以繼續調整、退出而不保存，或者保存目前修改後退出。',returnModal:modal.type==='drink'&&modal.parent?modal.parent:null,saveAction:modalSaveAction(modal)};\n    render();return;\n  }\n  modal=modal.type==='drink'&&modal.parent?modal.parent:null;confirmState=null;render();\n}"""
          if old not in text:
              raise SystemExit('requestDismiss block not found')
          text=text.replace(old,new,1)

          old="""  if(!confirmState)return notice;\n  const dissolve=confirmState.kind==='dissolve',dineCancel=confirmState.kind==='dine-cancel';"""
          new="""  if(!confirmState)return notice;\n  if(confirmState.kind==='modal-exit')return notice+'<div class=\"confirm-layer\"><section class=\"confirm-card\"><strong>'+confirmState.title+'</strong><p>'+confirmState.message+'</p><div><button data-action=\"confirm-cancel\">繼續調整</button><button class=\"danger\" data-action=\"confirm-discard\">退出不保存</button><button class=\"primary\" data-action=\"confirm-save-exit\" '+(confirmState.saveAction?'':'disabled')+'>保存並退出</button></div></section></div>';\n  const dissolve=confirmState.kind==='dissolve',dineCancel=confirmState.kind==='dine-cancel';"""
          if old not in text:
              raise SystemExit('customConfirm target not found')
          text=text.replace(old,new,1)

          old="""  else if(action==='confirm-discard'){modal=confirmState?.returnModal||null;confirmState=null;render();}\n  else if(action==='confirm-dine-cancel')completeDineCancellation();"""
          new="""  else if(action==='confirm-discard'){modal=confirmState?.returnModal||null;confirmState=null;render();}\n  else if(action==='confirm-save-exit'){const saveAction=confirmState?.saveAction;confirmState=null;if(saveAction)handle({dataset:{action:saveAction}});else{modal=null;render();}}\n  else if(action==='confirm-dine-cancel')completeDineCancellation();"""
          if old not in text:
              raise SystemExit('confirm action target not found')
          text=text.replace(old,new,1)

          old="""app.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button&&!button.disabled)handle(button);});"""
          new="""app.addEventListener('click',event=>{if(event.target.classList?.contains('modal-scrim')){event.preventDefault();requestDismiss();return;}const button=event.target.closest('[data-action]');if(button&&!button.disabled)handle(button);});"""
          if old not in text:
              raise SystemExit('app click target not found')
          text=text.replace(old,new,1)

          page.write_text(text)
          PY
      - name: Verify
        run: |
          ! grep -q 'modal-policy.js' pages/order/index.html
          grep -q 'modalSaveAction' pages/order/page.js
          grep -q 'confirm-save-exit' pages/order/page.js
      - name: Commit
        run: |
          git config user.name morefun-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add pages/order/index.html pages/order/page.js
          git commit -m 'refactor(order): consolidate modal lifecycle into core' || exit 0
          git push origin HEAD:smt-functional-completeness-v1
