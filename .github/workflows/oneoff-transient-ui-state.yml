name: oneoff-transient-ui-state
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/oneoff-transient-ui-state.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Separate transient UI state from transactional store writes
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime=Path('shared/runtime.js')
          t=runtime.read_text()
          old="""  function set(updater){
    const draft=safeClone(state);
    const next=typeof updater==='function'?updater(draft):updater;
    state=options.normalize?options.normalize(next):next;
    persist();
    listeners.forEach(listener=>listener(state));
  }
  function subscribe(listener){listeners.add(listener);return()=>listeners.delete(listener);}
  return {get,set,subscribe,persist};"""
          new="""  function set(updater){
    const draft=safeClone(state);
    const next=typeof updater==='function'?updater(draft):updater;
    state=options.normalize?options.normalize(next):next;
    persist();
    listeners.forEach(listener=>listener(state));
  }
  function setTransient(updater){
    const next=typeof updater==='function'?updater(state):updater;
    if(next==null||next===state)return;
    state=next;
    listeners.forEach(listener=>listener(state));
  }
  function subscribe(listener){listeners.add(listener);return()=>listeners.delete(listener);}
  return {get,set,setTransient,subscribe,persist};"""
          if old not in t: raise SystemExit('runtime store block not found')
          runtime.write_text(t.replace(old,new,1))

          page=Path('pages/order/page.js')
          t=page.read_text()
          repl={
            "quickDrawerTimer=setTimeout(()=>store.set(state=>({...state,quickDrawerOpen:false})),QUICK_DRAWER_IDLE_MS);":"quickDrawerTimer=setTimeout(()=>store.setTransient(state=>({...state,quickDrawerOpen:false})),QUICK_DRAWER_IDLE_MS);",
            "recentTimer=setTimeout(()=>store.set(state=>state.lastAffectedLineId===lineId?{...state,lastAffectedLineId:'',lastMutationKind:''}:state),1500);":"recentTimer=setTimeout(()=>{const current=store.get();if(current.lastAffectedLineId===lineId)store.setTransient(state=>({...state,lastAffectedLineId:'',lastMutationKind:''}));},1500);",
            "if(action==='category')store.set(state=>({...state,category:button.dataset.value}));":"if(action==='category')store.setTransient(state=>({...state,category:button.dataset.value}));",
            "else if(action==='clear-search'){store.set(state=>({...state,searchQuery:''}));}":"else if(action==='clear-search'){store.setTransient(state=>({...state,searchQuery:''}));}",
            "else if(action==='toggle-cart-category')store.set(state=>{const category=button.dataset.value;const collapsed=state.collapsedCartCategories.includes(category);return {...state,collapsedCartCategories:collapsed?state.collapsedCartCategories.filter(item=>item!==category):state.collapsedCartCategories.concat(category)};});":"else if(action==='toggle-cart-category')store.setTransient(state=>{const category=button.dataset.value;const collapsed=state.collapsedCartCategories.includes(category);return {...state,collapsedCartCategories:collapsed?state.collapsedCartCategories.filter(item=>item!==category):state.collapsedCartCategories.concat(category)};});",
            "else if(action==='toggle-quick-drawer'){store.set(state=>({...state,quickDrawerOpen:!state.quickDrawerOpen}));scheduleQuickDrawerClose();}":"else if(action==='toggle-quick-drawer'){store.setTransient(state=>({...state,quickDrawerOpen:!state.quickDrawerOpen}));scheduleQuickDrawerClose();}",
            "if(event.target.matches('[data-action=\"search-query\"]')&&modal?.type==='search'){const value=event.target.value;store.set(state=>({...state,searchQuery:value}));queue.afterRender":"if(event.target.matches('[data-action=\"search-query\"]')&&modal?.type==='search'){const value=event.target.value;store.setTransient(state=>({...state,searchQuery:value}));queue.afterRender"
          }
          for a,b in repl.items():
            if a not in t: raise SystemExit('page target not found: '+a[:80])
            t=t.replace(a,b,1)
          page.write_text(t)
          PY
      - name: Verify
        run: |
          grep -q 'function setTransient' shared/runtime.js
          grep -q 'setTransient(state=>({...state,category:' pages/order/page.js
          grep -q 'setTransient(state=>({...state,quickDrawerOpen:' pages/order/page.js
          grep -q 'setTransient(state=>({...state,searchQuery:value}' pages/order/page.js
      - name: Commit
        run: |
          git config user.name morefun-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add shared/runtime.js pages/order/page.js
          git commit -m 'perf(runtime): separate transient UI state from transactional writes' || exit 0
          git push origin HEAD:smt-functional-completeness-v1
