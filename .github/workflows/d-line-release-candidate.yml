name: D-line Release Candidate Gate

on:
  push:
    branches:
      - d-line-production-integration-v1
    paths:
      - 'android/**'
      - '.github/workflows/d-line-release-candidate.yml'
      - '.github/workflows/build-production-apk.yml'
  pull_request:
    branches:
      - smt-functional-completeness-v1
    paths:
      - 'android/**'
      - '.github/workflows/d-line-release-candidate.yml'
      - '.github/workflows/build-production-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d-line-rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run production integration contract
        run: bash android/verify-production-integration.sh

      - name: Compile debug and unsigned release APK
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify RC artifacts
        run: |
          set -euo pipefail
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          sha256sum "$DEBUG_APK" | tee "$DEBUG_APK.sha256"
          sha256sum "$RELEASE_APK" | tee "$RELEASE_APK.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RELEASE_APK" | tee android/app/build/outputs/apk/release/app-release-unsigned.badging.txt
          grep -Fq "package: name='hk.morefun.smt'" android/app/build/outputs/apk/release/app-release-unsigned.badging.txt
          grep -Fq "sdkVersion:'23'" android/app/build/outputs/apk/release/app-release-unsigned.badging.txt

      - uses: actions/upload-artifact@v4
        with:
          name: d-line-rc-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            android/app/build/outputs/apk/release/app-release-unsigned.badging.txt
          if-no-files-found: error
          retention-days: 14
