name: qa-runtime-phase3-exec
on:
  push:
    branches: [qa-runtime-phase3-exec-20260726]
    paths: ['.github/workflows/qa-runtime-phase3-exec.yml']
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-runtime-phase3-exec-20260726
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply core fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. 香港營業日時區固定 UTC+8
          p=Path('pages/more/more-domain.js')
          t=p.read_text()
          start=t.index('function localDateId(timestamp){')
          end=t.index('function orderTime(order){',start)
          replacement='''const HK_OFFSET_MS=8*60*60*1000;\nconst DAY_MS=24*60*60*1000;\n\nfunction hkParts(timestamp){\n  const date=new Date(number(timestamp)+HK_OFFSET_MS);\n  return {year:date.getUTCFullYear(),month:date.getUTCMonth()+1,day:date.getUTCDate(),hour:date.getUTCHours()};\n}\nfunction localDateId(timestamp){\n  const part=hkParts(timestamp);\n  return [part.year,String(part.month).padStart(2,'0'),String(part.day).padStart(2,'0')].join('-');\n}\nfunction hkEpoch(year,month,day,hour=0){\n  return Date.UTC(Number(year),Number(month)-1,Number(day),Number(hour)-8,0,0,0);\n}\nexport function businessWindow(now=Date.now(),startHour=5){\n  const point=hkParts(now);\n  let start=hkEpoch(point.year,point.month,point.day,startHour);\n  if(point.hour<Number(startHour))start-=DAY_MS;\n  return {id:localDateId(start),start,end:start+DAY_MS,startHour};\n}\nfunction dateAtBusinessStart(dateId,startHour=5){\n  const match=String(dateId||'').match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);\n  if(!match)throw new Error('日期格式無效');\n  const timestamp=hkEpoch(Number(match[1]),Number(match[2]),Number(match[3]),startHour);\n  if(localDateId(timestamp)!==dateId)throw new Error('日期格式無效');\n  return new Date(timestamp);\n}\nfunction shiftMonthsClamped(date,months){\n  const part=hkParts(date.getTime());\n  const first=new Date(Date.UTC(part.year,part.month-1+Number(months),1));\n  const year=first.getUTCFullYear(),month=first.getUTCMonth()+1;\n  const lastDay=new Date(Date.UTC(year,month,0)).getUTCDate();\n  return new Date(hkEpoch(year,month,Math.min(part.day,lastDay),part.hour));\n}\nexport function buildReportRange(preset='today',{now=Date.now(),startHour=5,startDate='',endDate=''}={}){\n  const today=businessWindow(now,startHour);\n  let start=today.start,end=today.end,label='今日';\n  if(preset==='yesterday'){start=today.start-DAY_MS;end=today.start;label='昨日';}\n  else if(preset==='7d'){start=today.start-(6*DAY_MS);label='最近 7 日';}\n  else if(preset==='30d'){start=today.start-(29*DAY_MS);label='最近 30 日';}\n  else if(preset==='3m'){start=shiftMonthsClamped(new Date(today.start),-3).getTime();label='最近 3 個月';}\n  else if(preset==='6m'){start=shiftMonthsClamped(new Date(today.start),-6).getTime();label='最近 6 個月';}\n  else if(preset==='custom'){\n    start=dateAtBusinessStart(startDate,startHour).getTime();\n    const inclusiveEnd=dateAtBusinessStart(endDate,startHour).getTime();\n    if(inclusiveEnd<start)throw new Error('結束日期不可早於開始日期');\n    if(inclusiveEnd>today.start)throw new Error('結束日期不可選擇未來營業日');\n    end=inclusiveEnd+DAY_MS;\n    const earliest=shiftMonthsClamped(new Date(today.start),-6).getTime();\n    if(start<earliest)throw new Error('SMT 每次最多查詢最近六個月');\n    label=startDate===endDate?startDate:`${startDate} 至 ${endDate}`;\n  }else if(preset!=='today')throw new Error('找不到報表日期範圍');\n  const inclusiveEnd=end-DAY_MS;\n  const resolvedStartDate=localDateId(start),resolvedEndDate=localDateId(inclusiveEnd);\n  return {id:preset==='today'?today.id:`${resolvedStartDate}_${resolvedEndDate}`,preset,label,start,end,startDate:resolvedStartDate,endDate:resolvedEndDate,startHour};\n}\n\n'''
          t=t[:start]+replacement+t[end:]
          t=t.replace('const hour=new Date(orderTime(order)).getHours();','const hour=hkParts(orderTime(order)).hour;')
          p.write_text(t)

          # 2. 啟動錯誤後備畫面，避免 hidden frame / 白屏
          p=Path('app-loader.js'); t=p.read_text()
          a=t.index('function showLoaderError(message,target=activeFrame){')
          b=t.index('function attachFrame(frame,key){',a)
          repl='''function loaderErrorDocument(message){\n  return '<!doctype html><html lang="zh-HK"><meta charset="UTF-8"><style>body{margin:0;display:grid;place-items:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif;background:#fff8f3;color:#382b24}.card{padding:28px;border:1px solid #ead9ce;border-radius:16px;background:#fff;text-align:center}</style><body><section class="card"><strong>頁面未能載入</strong><p>'+String(message||'請重新整理後再試')+'</p></section></body></html>';\n}\nfunction showLoaderError(message,target=activeFrame){\n  if(!target)return;\n  const key=target.dataset.route||pending||current||'order';\n  const mayReveal=target===activeFrame||key===pending||(!childReady&&key===current);\n  if(!mayReveal){console.error('PAGE_TRANSITION_FAILED',message);return;}\n  clearTimeout(watchdogTimer);\n  if(target!==activeFrame)target.addEventListener('load',()=>{readyRoutes.add(key);setActiveFrame(target,key);},{once:true});\n  target.srcdoc=loaderErrorDocument(message);\n  if(target===activeFrame)setShellRouteUi(key,{loading:false});\n}\n\n'''
          t=t[:a]+repl+t[b:]
          marker='  const message=event.data||{};\n'
          if marker in t and "message.type==='morefun:page-runtime-error'" not in t:
            handler="""  if(message.type==='morefun:page-runtime-error'){\n    const key=frame.dataset.route||message.page||pending||current||'order';\n    console.error('PAGE_RUNTIME_ERROR',key,message.message||'');\n    if(!readyRoutes.has(key)||key===pending||(!childReady&&key===current))showLoaderError((labels[key]||'頁面')+'啟動失敗，資料仍保存在本機。',frame);\n    else if(frame===activeFrame&&shellContext)shellContext.textContent='操作異常｜資料已保留';\n    return;\n  }\n"""
            t=t.replace(marker,marker+handler,1)
          p.write_text(t)

          # 3. 統一 Drink Choice Card：圖片先、名稱後、同一 count badge
          p=Path('pages/order/page.js'); t=p.read_text()
          old="""function drinkChoiceCard(d,action='select-drink',selected=false,context='default'){\n  const imageMode=store.get().settings.quickDrinks.showImages!==false;\n  return '<button class="drink-choice-card drink-card--'+context+' '+(imageMode?'is-image':'is-text')+' '+(selected?'selected':'')+'" data-action="'+action+'" data-id="'+d.id+'"><span>'+escapeHtml(d.name)+'</span>'+(imageMode?imageBlock(d.image,d.name,'drink-choice-img'):'')+'</button>';\n}"""
          new="""function drinkChoiceCard(d,action='select-drink',selected=false,context='default',count=0){\n  const imageMode=store.get().settings.quickDrinks.showImages!==false;\n  const badge=count?'<em class="drink-choice-count">✓ '+count+'</em>':'';\n  return '<button class="drink-choice-card drink-card--'+context+' '+(imageMode?'is-image':'is-text')+' '+(selected?'selected ':'')+(count?'has-assignment':'')+'" data-action="'+action+'" data-id="'+escapeHtml(d.id)+'" data-value="'+escapeHtml(d.id)+'" aria-label="'+escapeHtml(d.name)+(count?'，已選 '+count+' 份':'')+'">'+(imageMode?imageBlock(d.image,d.name,'drink-choice-img'):'')+'<span>'+escapeHtml(d.name)+'</span>'+badge+'</button>';\n}"""
          if old not in t: raise SystemExit('drinkChoiceCard target missing')
          t=t.replace(old,new,1)
          start="  if(group==='drink')choices="; end="  else choices="
          i=t.index(start); j=t.index(end,i)
          t=t[:i]+"  if(group==='drink')choices='<div class=\"required-drink-grid\">'+drinks.filter(item=>item.available!==false).map(item=>drinkChoiceCard(item,'completion-required-choice',Boolean(active&&assignments[active.id]===item.id),'completion',drinkAssignmentCounts.get(item.id)||0)).join('')+'</div>';\n"+t[j:]
          p.write_text(t)

          # 4. Drink Card component CSS
          p=Path('pages/order/page.css'); t=p.read_text()
          a=t.index('.drink-choice-card {'); b=t.index('.drink-choice-card.is-text {',a)
          block='''.drink-choice-card {\n  width:var(--drink-card-width);min-width:var(--drink-card-width);max-width:var(--drink-card-width);height:var(--drink-card-height);flex:none;position:relative;border:1px solid #e5ddd5;border-radius:12px;background:#fff;box-shadow:var(--lift);padding:7px;font-size:13px;line-height:1.15;font-weight:900;text-align:center;overflow:hidden;\n}\n.drink-choice-card>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.drink-choice-count{position:absolute;right:8px;top:8px;min-width:28px;height:28px;padding:0 8px;display:grid;place-items:center;border-radius:999px;background:var(--orange);color:#fff;font-style:normal;font-weight:950;box-shadow:0 2px 8px rgba(69,48,32,.18)}\n.drink-choice-card.is-image{display:grid;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:6px;align-items:stretch}\n'''
          t=t[:a]+block+t[b:]
          oldq='.quick-drawer-panel .drink-choice-card { width: 150px; min-width: 150px; height: 190px; padding: 10px; position: relative; }\n.quick-drawer-panel .drink-choice-card.is-image { grid-template-columns: 1fr; grid-template-rows: auto 1fr; text-align: center; }\n.quick-drawer-panel .drink-choice-card .drink-choice-img { width: 100%; height: 130px; object-fit: cover; }'
          newq='.drink-card--drawer,.drink-card--detail{width:150px;min-width:150px;max-width:150px;height:190px}.drink-card--completion{width:100%;min-width:0;max-width:none;height:170px}.quick-drawer-panel .drink-choice-card{position:relative}'
          if oldq in t:t=t.replace(oldq,newq,1)
          oldimg='.drink-choice-img {\n  width: var(--drink-image-size);\n  height: var(--drink-image-size);\n  border-radius: 9px;\n}'
          newimg='.drink-choice-img{width:100%;height:100%;min-height:0;border-radius:9px;object-fit:cover}.drink-choice-card.is-text .drink-choice-img{display:none}'
          if oldimg in t:t=t.replace(oldimg,newimg,1)
          p.write_text(t)

          # 5. Adaptive only controls container, not card internals
          p=Path('shared/adaptive-layout.css'); t=p.read_text()
          t=t.replace('body[data-page="order"] .required-drink-grid button{min-height:112px;grid-template-rows:72px auto;padding:8px}\nbody[data-page="order"] .required-choice-img{width:72px;height:72px}\n','body[data-page="order"] .required-drink-grid .drink-card--completion{min-width:0;max-width:none}\n')
          t=t.replace('width:min(72vw,1380px);\n  height:min(62vh,720px);','width:min(88vw,1560px);\n  height:min(76vh,860px);')
          marker='/* Shared modal-policy confirmation. */'
          if marker in t:t=t[:t.index(marker)].rstrip()+'\n'
          p.write_text(t)
          PY
      - name: Align stale regression contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('tests').glob('*.test.mjs'):
            t=p.read_text(); old=t
            t=t.replace("assert.match(loader,/logicalHeight/);","assert.match(loader,/getResponsiveProfile/);")
            t=t.replace("assert.match(loader,/morefun:set-ui-scale/);","assert.match(loader,/morefun-smt-ui-scale/);")
            t=t.replace("assert.match(baseCss,/\\.bottom-nav\\s*\\{[^}]*height:\\s*76px/s);","assert.match(baseCss,/\\.bottom-nav\\s*\\{[^}]*height:\\s*auto[^}]*min-height:\\s*calc\\(var\\(--bottom-nav-height\\)/s);")
            t=t.replace("assert.match(orderPage,/service-mode/);","assert.match(orderPage,/toggle-line-service/);")
            t=t.replace("assert.match(orderPage,/data-action=\\\"service-mode\\\"/);","assert.match(orderPage,/data-action=\"toggle-line-service\"/);")
            t=t.replace("assert.match(orderPage,/serviceMode:line\\.serviceMode/);","assert.match(orderPage,/line\\.serviceMode===SERVICE_DINE_IN/);")
            t=t.replace("assert.match(page,/const filtered=sortPausedLast/);","assert.match(page,/return sortPausedLast\\(categoryProducts\\.filter/);")
            t=t.replace("assert.match(page,/:\\s*'結帳 '\\+money\\(cartTotal\\(state\\.cart\\)\\)/);","assert.match(page,/hasCart\\?'結帳 '\\+money\\(cartTotal\\(state\\.cart\\)\\)/);")
            if t!=old:p.write_text(t)
          PY
      - name: Run full regression and syntax verification
        shell: bash
        run: |
          set +e
          mkdir -p docs/qa
          node --test tests/*.test.mjs > /tmp/tests.log 2>&1
          TEST_STATUS=$?
          SYNTAX_STATUS=0
          for f in app-loader.js shared/runtime.js shared/adaptive-layout.js shared/page-bridge.js pages/order/page.js pages/order/order-domain.js pages/order/menu-api.js pages/checkout/page.js pages/more/more-domain.js; do
            node --check "$f" >> /tmp/syntax.log 2>&1 || SYNTAX_STATUS=1
          done
          {
            echo '# SMT Runtime Phase 3 QA'; echo; echo "Candidate: $(git rev-parse HEAD)"; echo
            echo '## Regression totals'; grep -E '^# (tests|pass|fail|cancelled|skipped|todo)' /tmp/tests.log || true; echo
            echo '## Failing tests'; grep -E '^not ok' /tmp/tests.log || true; echo
            echo '## Syntax'; cat /tmp/syntax.log; echo
            echo "TEST_STATUS=$TEST_STATUS"; echo "SYNTAX_STATUS=$SYNTAX_STATUS"
            if [ "$TEST_STATUS" -eq 0 ] && [ "$SYNTAX_STATUS" -eq 0 ]; then echo 'RESULT=PASS'; else echo 'RESULT=FAIL'; fi
          } > docs/qa/SMT_RUNTIME_PHASE3_QA.md
          cat docs/qa/SMT_RUNTIME_PHASE3_QA.md
      - name: Commit candidate and QA report
        shell: bash
        run: |
          git config user.name morefun-qa-bot
          git config user.email actions@users.noreply.github.com
          git add pages shared app-loader.js tests docs/qa
          git commit -m 'fix(runtime): apply phase 3 core QA candidate' || true
          git push origin HEAD:qa-runtime-phase3-exec-20260726
