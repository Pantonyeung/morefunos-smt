name: Diagnose Android Keystore Secret

on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/diagnose-keystore-secret.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and decode only
        id: decode
        env:
          KEYSTORE_B64: ${{ secrets.MOREFUN_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = os.environ.get('KEYSTORE_B64', '')
          normalized = ''.join(raw.split())
          prefix = 'MOREFUN_ANDROID_KEYSTORE_B64='
          prefix_detected = int(normalized.startswith(prefix))
          if prefix_detected:
              normalized = normalized[len(prefix):]
          if len(normalized) >= 2 and normalized[0] == normalized[-1] and normalized[0] in {'"', "'"}:
              normalized = normalized[1:-1]

          allowed = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          invalid_count = sum(ch not in allowed for ch in normalized)
          decoded = b''
          decode_ok = 0
          try:
              decoded = base64.b64decode(normalized, validate=True)
              decode_ok = int(bool(decoded))
          except Exception:
              decode_ok = 0

          if decode_ok:
              Path('/tmp/morefun-release.jks').write_bytes(decoded)

          diagnosis = '\n'.join([
              f'raw_len={len(raw)}',
              f'normalized_len={len(normalized)}',
              f'length_mod4={len(normalized) % 4}',
              f'invalid_count={invalid_count}',
              f'prefix_detected={prefix_detected}',
              f'decode_ok={decode_ok}',
              f'decoded_bytes={len(decoded)}',
              ''
          ])
          Path('/tmp/keystore-diagnosis.txt').write_text(diagnosis, encoding='utf-8')
          raise SystemExit(0 if decode_ok else 1)
          PY
      - name: Publish isolated diagnosis marker
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs=require('fs');
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='.github/keystore-decode-diagnosis.txt';
            const branch='smt-functional-completeness-v1';
            const diagnosis=fs.existsSync('/tmp/keystore-diagnosis.txt')?fs.readFileSync('/tmp/keystore-diagnosis.txt','utf8'):'diagnosis_unavailable=1\n';
            const body=[`status=${process.env.JOB_STATUS}`,`run_id=${context.runId}`,`sha=${context.sha}`,diagnosis].join('\n');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,message:`ci(apk): record keystore decode ${process.env.JOB_STATUS}`,content:Buffer.from(body).toString('base64'),sha});