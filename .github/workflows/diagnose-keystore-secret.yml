name: Diagnose Android Keystore Secret

on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/diagnose-keystore-secret.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and decode only
        id: decode
        env:
          KEYSTORE_B64: ${{ secrets.MOREFUN_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set +e
          raw="$KEYSTORE_B64"
          raw_len=${#raw}
          normalized="$(printf '%s' "$raw" | tr -d '\r\n\t ' | sed -E 's/^MOREFUN_ANDROID_KEYSTORE_B64=//' | sed -E 's/^["'"']//' | sed -E 's/["'"']$//')"
          normalized_len=${#normalized}
          invalid_count=$(printf '%s' "$normalized" | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')
          prefix_detected=0
          case "$raw" in MOREFUN_ANDROID_KEYSTORE_B64=*) prefix_detected=1;; esac
          decode_ok=0
          decoded_bytes=0
          if [ -n "$normalized" ] && printf '%s' "$normalized" | base64 --decode > /tmp/morefun-release.jks 2>/tmp/decode-error.txt; then
            decode_ok=1
            decoded_bytes=$(wc -c < /tmp/morefun-release.jks | tr -d ' ')
          fi
          {
            echo "raw_len=$raw_len"
            echo "normalized_len=$normalized_len"
            echo "length_mod4=$((normalized_len % 4))"
            echo "invalid_count=$invalid_count"
            echo "prefix_detected=$prefix_detected"
            echo "decode_ok=$decode_ok"
            echo "decoded_bytes=$decoded_bytes"
          } > /tmp/keystore-diagnosis.txt
          test "$decode_ok" = 1
      - name: Publish isolated diagnosis marker
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs=require('fs');
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='.github/keystore-decode-diagnosis.txt';
            const branch='smt-functional-completeness-v1';
            const diagnosis=fs.existsSync('/tmp/keystore-diagnosis.txt')?fs.readFileSync('/tmp/keystore-diagnosis.txt','utf8'):'diagnosis_unavailable=1\n';
            const body=[`status=${process.env.JOB_STATUS}`,`run_id=${context.runId}`,`sha=${context.sha}`,diagnosis].join('\n');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,message:`ci(apk): record keystore decode ${process.env.JOB_STATUS}`,content:Buffer.from(body).toString('base64'),sha});