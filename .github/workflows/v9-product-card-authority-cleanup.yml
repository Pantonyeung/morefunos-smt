name: V9 Product Card Authority Cleanup

on:
  pull_request:
    branches:
      - smt-functional-completeness-v1
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: v9-product-card-authority-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: startsWith(github.head_ref, 'v9-product-card-legacy-cleanup') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify V9 cleanup parser contracts
        run: node --test tests/cleanup-order-page-product-card-legacy.test.mjs tests/product-card-visual-authority.test.mjs

      - name: Apply guarded V9 Product Card legacy cleanup
        run: node scripts/cleanup-order-page-product-card-legacy.mjs

      - name: Migrate Product Card regression assertions to final authority
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='tests/order-edit-flow.test.mjs';
          let text=fs.readFileSync(file,'utf8');
          const cartLine="const cartCss = await readFile(new URL('../pages/order/cart.css', import.meta.url), 'utf8');";
          const productLine="const productCss = await readFile(new URL('../pages/order/product-card.css', import.meta.url), 'utf8');";
          if(!text.includes(productLine)){
            if(!text.includes(cartLine))throw new Error('Cart CSS test authority line missing');
            text=text.replace(cartLine,cartLine+'\n'+productLine);
          }
          const replacements=[
            ["assert.match(css,/\\.product-card\\.large\\s*\\{[^}]*min-height:/);", "assert.match(productCss,/\\.product-card\\.large\\s*\\{[^}]*min-height:/);"],
            ["assert.match(css,/\\.product-card\\.sold-out/);", "assert.match(productCss,/\\.product-card\\.sold-out/);"],
            ["assert.match(css,/\\.product-card\\.paused/);", "assert.match(productCss,/\\.product-card\\.paused/);"],
            ["assert.doesNotMatch(css,/\\.product-card\\.sold-out[^}]*grayscale/);", "assert.doesNotMatch(productCss,/\\.product-card\\.sold-out[^}]*grayscale/);"],
          ];
          for(const [from,to] of replacements){if(text.includes(from))text=text.replace(from,to);}
          const required=[
            "const productCss = await readFile(new URL('../pages/order/product-card.css', import.meta.url), 'utf8');",
            "assert.match(productCss,/\\.product-card\\.large\\s*\\{[^}]*min-height:/);",
            "assert.match(productCss,/\\.product-card\\.sold-out/);",
            "assert.match(productCss,/\\.product-card\\.paused/);",
            "assert.doesNotMatch(productCss,/\\.product-card\\.sold-out[^}]*grayscale/);",
          ];
          for(const needle of required){if(!text.includes(needle))throw new Error('Product Card regression authority missing: '+needle);}
          fs.writeFileSync(file,text,'utf8');
          NODE

      - name: Assert V9 legacy selectors are absent
        run: |
          if grep -En '\.product-card|\.product-hero|\.product-info|\.product-copy|\.product-price|\.product-description|\.product-code|\.product-thumb|\.product-supply-state' pages/order/page.css; then
            echo 'V9 Product Card legacy selectors still exist in page.css'
            exit 1
          fi

      - name: Component ownership audit
        run: node scripts/audit-component-ownership.mjs

      - name: AI context validation
        run: node scripts/validate-ai-context.mjs

      - name: Full Node regression
        run: node --test tests/*.test.mjs

      - name: Commit only verified V9 cleanup output
        run: |
          git config user.name 'MoreFun Product Card Authority QA'
          git config user.email 'actions@users.noreply.github.com'
          git add pages/order/page.css tests/order-edit-flow.test.mjs
          if git diff --cached --quiet; then
            echo 'No V9 Product Card cleanup change required.'
            exit 0
          fi
          git commit -m 'refactor(order): physically remove V9 Product Card legacy authority'
          git push origin HEAD:${{ github.head_ref }}
