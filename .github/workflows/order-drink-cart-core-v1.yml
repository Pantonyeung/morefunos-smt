name: order-drink-cart-core-v1
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/order-drink-cart-core-v1.yml']
permissions:
  contents: write
jobs:
  refine-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refine formal order components
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Cart marker: 外/堂 above, sequence below.
          p=Path('pages/order/page.js'); t=p.read_text()
          old="return '<article class=\"cart-row '+(showImages?'':'no-image')+' '+(recent?'is-recent':'')+'\" data-line-id=\"'+escapeHtml(line.lineId)+'\"><span class=\"seq-service\"><span class=\"seq\">'+(index+1)+'</span><button class=\"line-service-toggle '+(override?'is-override':'')+'\" data-action=\"toggle-line-service\" data-id=\"'+escapeHtml(line.lineId)+'\" aria-label=\"切換'+escapeHtml(line.name)+'堂食外賣\">'+modeLabel+'</button></span>'"
          new="return '<article class=\"cart-row '+(showImages?'':'no-image')+' '+(recent?'is-recent':'')+'\" data-line-id=\"'+escapeHtml(line.lineId)+'\"><span class=\"seq-service\"><button class=\"line-service-toggle '+(line.serviceMode===SERVICE_DINE_IN?'dine ':'takeaway ')+(override?'is-override':'')+'\" data-action=\"toggle-line-service\" data-id=\"'+escapeHtml(line.lineId)+'\" aria-label=\"切換'+escapeHtml(line.name)+'堂食外賣\">'+modeLabel+'</button><span class=\"seq\">'+(index+1)+'</span></span>'"
          if old not in t: raise SystemExit('cartLineRow marker target missing')
          t=t.replace(old,new,1)

          # Drink card core: compact title above, image as visual body below.
          old2="return '<button class=\"drink-choice-card drink-card--'+context+' '+(imageMode?'is-image':'is-text')+' '+(selected?'selected ':'')+(count?'has-assignment':'')+'\" data-action=\"'+action+'\" data-id=\"'+escapeHtml(d.id)+'\" data-value=\"'+escapeHtml(d.id)+'\" aria-label=\"'+escapeHtml(d.name)+(count?'，已選 '+count+' 份':'')+'\">'+(imageMode?imageBlock(d.image,d.name,'drink-choice-img'):'')+'<span>'+escapeHtml(d.name)+'</span>'+badge+'</button>';"
          new2="return '<button class=\"drink-choice-card drink-card--'+context+' '+(imageMode?'is-image':'is-text')+' '+(selected?'selected ':'')+(count?'has-assignment':'')+'\" data-action=\"'+action+'\" data-id=\"'+escapeHtml(d.id)+'\" data-value=\"'+escapeHtml(d.id)+'\" aria-label=\"'+escapeHtml(d.name)+(count?'，已選 '+count+' 份':'')+'\"><span>'+escapeHtml(d.name)+'</span>'+(imageMode?imageBlock(d.image,d.name,'drink-choice-img'):'')+badge+'</button>';"
          if old2 not in t: raise SystemExit('drinkChoiceCard target missing')
          t=t.replace(old2,new2,1)
          p.write_text(t)

          # Formal drink-card component appearance.
          p=Path('pages/order/page.css'); t=p.read_text()
          start=t.index('.drink-choice-card {')
          end=t.index('.link-candidates {',start)
          block='''.drink-choice-card {\n  width:var(--drink-card-width);min-width:var(--drink-card-width);max-width:var(--drink-card-width);height:var(--drink-card-height);flex:none;position:relative;border:1px solid #e5ddd5;border-radius:12px;background:#fff;box-shadow:var(--lift);padding:6px;font-size:13px;line-height:1.08;font-weight:900;text-align:center;overflow:hidden;\n}\n.drink-choice-card>span{min-width:0;min-height:24px;max-height:28px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}\n.drink-choice-count{position:absolute;right:7px;top:34px;min-width:28px;height:28px;padding:0 8px;display:grid;place-items:center;border-radius:999px;background:var(--orange);color:#fff;font-style:normal;font-weight:950;box-shadow:0 2px 8px rgba(69,48,32,.18);z-index:3}\n.drink-choice-card.is-image{display:grid;grid-template-columns:1fr;grid-template-rows:28px minmax(0,1fr);gap:3px;align-items:stretch}\n.drink-choice-card.is-text{display:grid;place-items:center;text-align:center}\n.drink-choice-card.selected{background:var(--orange-soft);border-color:#f0a578;box-shadow:inset 0 0 0 1px #f0a578,var(--lift)}\n.drink-card--drawer,.drink-card--detail{width:188px;min-width:188px;max-width:188px;height:184px}\n.drink-card--completion{width:100%;min-width:0;max-width:none;height:190px}\n.quick-drawer-panel .drink-choice-card{position:relative}\n.quick-drawer-panel .drink-choice-card.selected::after{content:\"\";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--orange)}\n.drink-choice-img{width:100%;height:100%;min-height:0;border-radius:9px;overflow:hidden}\n.drink-choice-img img{width:100%;height:100%;object-fit:cover;transform:scale(1.22);transform-origin:center}\n.drink-choice-card.is-text .drink-choice-img{display:none}\n'''
          t=t[:start]+block+t[end:]
          p.write_text(t)

          # Cart component owns cart marker geometry and quick-drawer container size only.
          p=Path('pages/order/cart.css'); t=p.read_text()
          replacements={
            ".cart-row>.seq-service{position:static;width:42px;height:60px;align-self:center;display:grid;grid-template-rows:31px 29px;border:1px solid #ddcfc4;border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(69,48,32,.05)}":".cart-row>.seq-service{position:static;width:42px;height:60px;align-self:center;display:grid;grid-template-rows:24px 36px;border:1px solid #ddcfc4;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(69,48,32,.05)}",
            ".cart-row>.seq-service>.seq{position:static;width:100%;height:31px;margin:0;padding:0;border:0;border-radius:0;background:#f8f4f0;color:#4f4037;font-size:17px;line-height:31px;text-align:center;display:block;font-weight:950}":".cart-row>.seq-service>.seq{position:static;width:100%;height:36px;margin:0;padding:0;border:0;border-radius:0;background:#fff;color:#4f4037;font-size:17px;line-height:36px;text-align:center;display:block;font-weight:950}",
            ".cart-row>.seq-service>.line-service-toggle{position:static;width:100%;min-width:0;height:29px;margin:0;padding:0;border:0;border-top:1px solid #ddcfc4;border-radius:0;background:#fff;color:#5f493c;font-size:15px;line-height:28px;text-align:center;font-weight:950;box-shadow:none}":".cart-row>.seq-service>.line-service-toggle{position:static;width:100%;min-width:0;height:24px;margin:0;padding:0;border:0;border-bottom:1px solid #eaded5;border-radius:0;background:#fff8f4;color:#b84216;font-size:12px;line-height:23px;text-align:center;font-weight:950;box-shadow:none}",
            ".cart-row>.seq-service>.line-service-toggle.is-override{background:#fff0e7;color:#b84216;border-top-color:#efb18b}":".cart-row>.seq-service>.line-service-toggle.takeaway{background:#fff8f4;color:#b84216}.cart-row>.seq-service>.line-service-toggle.dine{background:#f4f0ec;color:#5f493c}.cart-row>.seq-service>.line-service-toggle.is-override{box-shadow:inset 0 -2px 0 #ef9b69}",
            ".cart-row.is-recent .seq-service .seq{background:var(--orange);color:#fff}":".cart-row.is-recent .seq-service .seq{background:#fff;color:#4f4037}",
          }
          for old,new in replacements.items():
            if old not in t: raise SystemExit('cart css target missing: '+old[:50])
            t=t.replace(old,new,1)

          a=t.index('.required-drink-grid{')
          b=t.index('.modal-card[data-pointer-side]::before',a)
          newblock='''.required-drink-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;overflow-y:auto;overflow-x:hidden;align-content:start;padding-right:2px}\n.required-drink-grid .drink-card--completion{height:190px;min-height:190px;padding:6px}\n.required-drink-grid .drink-choice-card.selected,.required-drink-grid .drink-choice-card.has-assignment,.quick-drawer-panel .drink-choice-card.selected{border-color:#ef9b69;background:#fff0e7;color:#b84216;box-shadow:inset 0 0 0 2px rgba(239,91,35,.22)}\n.required-drink-grid .drink-choice-card.selected::after,.quick-drawer-panel .drink-choice-card.selected::after{content:'✓';position:absolute;right:7px;top:34px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--orange);color:#fff;font-size:15px;font-weight:950;box-shadow:0 2px 7px rgba(69,48,32,.16)}\n.required-drink-grid .drink-choice-card.has-assignment::after{display:none}\n.required-fill{min-height:46px;border:1px dashed #d7c3b5;border-radius:10px;background:#fff;color:#6f5b4f;font-weight:900}\n.required-workflow-actions{flex:none;display:grid;grid-template-columns:120px 1fr;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:#fff}.required-workflow-actions .primary{background:var(--orange);border-color:var(--orange);color:#fff}.required-workflow-actions .primary:disabled{opacity:.42;filter:saturate(.25);cursor:not-allowed}\n.quick-drawer-panel{height:248px}\n.quick-drawer-panel>header{position:relative;z-index:2}\n.quick-drawer-panel>div:last-child{display:flex;gap:10px;min-height:0;overflow-x:auto;overflow-y:hidden;padding:8px 12px 12px}\n.quick-drawer-panel .drink-choice-card{width:188px;min-width:188px;max-width:188px;height:184px}\n.quick-drawer-panel .image-fallback,.required-drink-grid .image-fallback{font-size:0;color:transparent}\n.quick-drawer-panel .image-fallback::after,.required-drink-grid .image-fallback::after{content:''}\n'''
          t=t[:a]+newblock+t[b:]

          oldmedia=".cart-row>.seq-service{width:38px;height:56px;grid-template-rows:29px 27px}.cart-row>.seq-service>.seq{height:29px;line-height:29px;font-size:15px}.cart-row>.seq-service>.line-service-toggle{height:27px;line-height:26px;font-size:13px}"
          newmedia=".cart-row>.seq-service{width:38px;height:56px;grid-template-rows:22px 34px}.cart-row>.seq-service>.seq{height:34px;line-height:34px;font-size:15px}.cart-row>.seq-service>.line-service-toggle{height:22px;line-height:21px;font-size:11px}"
          if oldmedia not in t: raise SystemExit('media marker target missing')
          t=t.replace(oldmedia,newmedia,1)
          p.write_text(t)

          # Update product contract tests to the newly approved, source-derived UI.
          p=Path('tests/order-edit-flow.test.mjs'); t=p.read_text()
          t=t.replace("assert.match(page,/<span>.*<\\/span>'\\+\\(imageMode\\?imageBlock/);","assert.match(page,/<span>.*<\\/span>'\\+\\(imageMode\\?imageBlock/);")
          # Lock service label before sequence in the cart marker.
          marker="test('cart keeps price flush right and actions aligned with the image',()=>{"
          insert="""test('cart marker keeps service mode above the sequence number',()=>{\n  assert.match(page,/seq-service.*line-service-toggle[\\s\\S]*class=\\\"seq\\\"/);\n  assert.match(css,/grid-template-rows:\\s*24px 36px/);\n});\n\n"""
          if insert not in t:t=t.replace(marker,insert+marker,1)
          p.write_text(t)

          # Bump cache keys so the iPad sees this exact UI.
          p=Path('pages/order/index.html'); t=p.read_text()
          t=t.replace('page.css?v=order-v1-31','page.css?v=order-drink-card-v1')
          t=t.replace('cart.css?v=order-cart-core-v8','cart.css?v=order-cart-core-v9')
          t=t.replace('page.js?v=order-core-v16','page.js?v=order-core-v17')
          p.write_text(t)
          PY
      - name: Full regression
        shell: bash
        run: |
          node --test tests/*.test.mjs
          node --check pages/order/page.js
          node --check shared/runtime.js
          node --check app-loader.js
      - name: Commit verified core changes
        shell: bash
        run: |
          git config user.name 'MoreFun QA Bot'
          git config user.email 'morefun-qa@users.noreply.github.com'
          git add pages/order/page.js pages/order/page.css pages/order/cart.css pages/order/index.html tests/order-edit-flow.test.mjs
          git commit -m 'refactor(order): unify drink cards and cart service marker'
          git push origin HEAD:smt-functional-completeness-v1
