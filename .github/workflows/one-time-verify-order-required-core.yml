name: One-time verify order required core

on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/one-time-verify-order-required-core.yml']

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify core syntax and contracts
        run: |
          node --check pages/order/page.js
          node tests/order-required-completion-core.test.mjs
      - name: Remove one-time verifier
        run: rm .github/workflows/one-time-verify-order-required-core.yml
      - name: Commit verifier cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-time-verify-order-required-core.yml
          git commit -m "chore: remove one-time required core verifier"
          git push origin HEAD:smt-functional-completeness-v1
