name: Incoming Queue Contract

on:
  pull_request:
    branches:
      - smt-functional-completeness-v1
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  incoming-queue-contract:
    if: startsWith(github.head_ref, 'incoming-queue-domain')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Incoming queue contract
        run: node --test tests/incoming-queue-domain.test.mjs
