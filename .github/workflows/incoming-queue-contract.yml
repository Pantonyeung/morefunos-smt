name: Incoming Queue Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smt-incoming-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incoming-queue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated Incoming Queue contract
        run: node --test tests/incoming-queue-domain.test.mjs
