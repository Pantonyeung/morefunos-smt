name: Incoming Queue Contract

on:
  pull_request:
    branches: [smt-functional-completeness-v1]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [incoming-queue-domain-v1]
    paths:
      - '.github/workflows/incoming-queue-contract.yml'
      - 'pages/orders/incoming-queue-domain.js'
      - 'tests/incoming-queue-domain.test.mjs'

permissions:
  contents: write

jobs:
  incoming-queue-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated Incoming Queue contract
        run: node --test tests/incoming-queue-domain.test.mjs
      - name: Publish Incoming Queue result marker
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='.github/incoming-queue-contract-last-result.txt';
            const branch='incoming-queue-domain-v1';
            const body=[`status=${process.env.JOB_STATUS}`,`run_id=${context.runId}`,`sha=${context.sha}`,`updated_at=${new Date().toISOString()}`,''].join('\n');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}catch(error){if(error.status!==404)throw error;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,message:`ci(incoming): record ${process.env.JOB_STATUS}`,content:Buffer.from(body).toString('base64'),sha});