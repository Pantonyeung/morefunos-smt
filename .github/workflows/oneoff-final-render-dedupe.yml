name: oneoff-final-render-dedupe
on:
  push:
    branches: [smt-functional-completeness-v1]
    paths: ['.github/workflows/oneoff-final-render-dedupe.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Remove remaining store plus manual render duplicates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/order/page.js')
          t=p.read_text()
          old="store.set(state=>({...state,cart:[],draftSession:null,dineContext:null,orderServiceMode:SERVICE_TAKEAWAY,lastAffectedLineId:'',lastMutationKind:''}));modal=null;render();showToast('已正式加入 '+button.dataset.id+' 號枱及建立打印工作');"
          new="store.set(state=>({...state,cart:[],draftSession:null,dineContext:null,orderServiceMode:SERVICE_TAKEAWAY,lastAffectedLineId:'',lastMutationKind:''}));modal=null;queue.afterRender(()=>showToast('已正式加入 '+button.dataset.id+' 號枱及建立打印工作'));"
          if old not in t: raise SystemExit('assign table render target not found')
          t=t.replace(old,new,1)
          old="store.set(state=>{state.cart=normalizeCart(dissolveRiceballSet(state.cart,lineId,{idFactory:role=>stableId('line-'+role)}),state.orderServiceMode);state.lastAffectedLineId=state.cart.at(-1)?.lineId||'';state.lastMutationKind='changed';return state;});confirmState=null;modal=null;render();showToast('套餐已拆開並按單品重新計價');"
          new="store.set(state=>{state.cart=normalizeCart(dissolveRiceballSet(state.cart,lineId,{idFactory:role=>stableId('line-'+role)}),state.orderServiceMode);state.lastAffectedLineId=state.cart.at(-1)?.lineId||'';state.lastMutationKind='changed';return state;});confirmState=null;modal=null;queue.afterRender(()=>showToast('套餐已拆開並按單品重新計價'));"
          if old not in t: raise SystemExit('dissolve render target not found')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Verify
        run: |
          ! grep -q "modal=null;render();showToast('已正式加入'" pages/order/page.js
          ! grep -q "modal=null;render();showToast('套餐已拆開" pages/order/page.js
      - name: Commit
        run: |
          git config user.name morefun-refactor-bot
          git config user.email actions@users.noreply.github.com
          git add pages/order/page.js
          git commit -m 'perf(order): remove remaining duplicate transaction renders' || exit 0
          git push origin HEAD:smt-functional-completeness-v1
