name: oneoff-adaptive-event-driven

on:
  push:
    branches:
      - smt-functional-completeness-v1
    paths:
      - .github/workflows/oneoff-adaptive-event-driven.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Replace adaptive DOM observer with explicit invalidation event
        run: |
          python - <<'PY'
          from pathlib import Path
          adaptive=Path('shared/adaptive-layout.js')
          text=adaptive.read_text()
          old="""  const mutationObserver=new MutationObserver(schedule);\n  mutationObserver.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});\n  addEventListener('resize',schedule,{passive:true});"""
          new="""  addEventListener('morefun:layout-invalidated',schedule);\n  addEventListener('resize',schedule,{passive:true});"""
          if old not in text:
            raise SystemExit('adaptive observer block not found')
          adaptive.write_text(text.replace(old,new,1))

          page=Path('pages/order/page.js')
          text=page.read_text()
          old1="window.parent?.postMessage?.({type:'morefun:overlay-state',open:Boolean(modal||confirmState)},'*');\n    return;"
          new1="window.parent?.postMessage?.({type:'morefun:overlay-state',open:Boolean(modal||confirmState)},'*');\n    window.dispatchEvent(new Event('morefun:layout-invalidated'));\n    return;"
          old2="window.parent?.postMessage?.({type:'morefun:overlay-state',open:Boolean(modal||confirmState)},'*');\n}"
          new2="window.parent?.postMessage?.({type:'morefun:overlay-state',open:Boolean(modal||confirmState)},'*');\n  window.dispatchEvent(new Event('morefun:layout-invalidated'));\n}"
          if old1 not in text or old2 not in text:
            raise SystemExit('order render invalidation targets not found')
          page.write_text(text.replace(old1,new1,1).replace(old2,new2,1))
          PY
      - name: Verify
        run: |
          ! grep -q "new MutationObserver(schedule)" shared/adaptive-layout.js
          grep -q "morefun:layout-invalidated" shared/adaptive-layout.js
          test "$(grep -c "morefun:layout-invalidated" pages/order/page.js)" -ge 2
      - name: Commit
        run: |
          git config user.name "morefun-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shared/adaptive-layout.js pages/order/page.js
          git commit -m "perf(adaptive): replace DOM observer with explicit layout invalidation" || exit 0
          git push origin HEAD:smt-functional-completeness-v1