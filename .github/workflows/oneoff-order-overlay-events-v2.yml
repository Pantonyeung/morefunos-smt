name: oneoff-order-overlay-events-v2

on:
  push:
    branches:
      - smt-functional-completeness-v1
    paths:
      - .github/workflows/oneoff-order-overlay-events-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smt-functional-completeness-v1
      - name: Emit overlay state from order render lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('pages/order/page.js')
          text=path.read_text()
          old1="    requestAnimationFrame(()=>{positionActiveCard();restoreCartViewport(state,0);});\n    return;"
          new1="    requestAnimationFrame(()=>{positionActiveCard();restoreCartViewport(state,0);});\n    window.parent?.postMessage?.({type:'morefun:overlay-state',open:Boolean(modal||confirmState)},'*');\n    return;"
          old2="  if(renderKeys.modal!==modalKey){refreshModalSurface(state);renderKeys.modal=modalKey;}\n}"
          new2="  if(renderKeys.modal!==modalKey){refreshModalSurface(state);renderKeys.modal=modalKey;}\n  window.parent?.postMessage?.({type:'morefun:overlay-state',open:Boolean(modal||confirmState)},'*');\n}"
          if old1 not in text or old2 not in text:
            raise SystemExit('order render targets not found')
          text=text.replace(old1,new1,1).replace(old2,new2,1)
          path.write_text(text)
          PY
      - name: Verify
        run: |
          test "$(grep -c "morefun:overlay-state" pages/order/page.js)" -ge 2
      - name: Commit
        run: |
          git config user.name "morefun-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/order/page.js
          git commit -m "perf(order): emit overlay state from render lifecycle" || exit 0
          git push origin HEAD:smt-functional-completeness-v1