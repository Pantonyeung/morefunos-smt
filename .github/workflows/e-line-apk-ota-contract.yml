name: E-line APK OTA Contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e-line-apk-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-ota-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch frozen D-line baseline
        run: git fetch origin d-line-production-integration-v1:d-line-production-integration-v1

      - name: Run E-line isolation and APK OTA contract
        run: bash android/verify-apk-ota.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile E-line host
        run: gradle -p android :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify E-line artifacts
        run: |
          set -euo pipefail
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          sha256sum "$DEBUG_APK" | tee "$DEBUG_APK.sha256"
          sha256sum "$RELEASE_APK" | tee "$RELEASE_APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: e-line-apk-ota-foundation-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 14