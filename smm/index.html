<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <base href="/">
  <title>磨飯 SMM</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/smm/mobile-app.css?v=smm-mobile-core-20260801e">
  <script>
    (function(){
      localStorage.setItem('morefun:operations-api-base-url','https://morefunos-admin.pages.dev');
      var params=new URLSearchParams(location.search);
      params.set('profile','mobile');
      if(!params.get('terminal'))params.set('terminal','SMM-01');
      history.replaceState(null,'',location.pathname+'?'+params.toString()+location.hash);
      document.documentElement.dataset.appProfile='mobile';
      window.__MOREFUN_APP_PROFILE__=Object.freeze({profile:'mobile',source:'smm',terminalId:params.get('terminal'),printMode:'remote-job'});
    })();
  </script>
</head>
<body>
  <div id="smm-app" class="smm-app" aria-label="磨飯 SMM Mobile Profile"></div>
  <section id="startup-gate" class="startup-gate" aria-live="polite">
    <div class="startup-card" data-startup-step="login">
      <div class="startup-brand"><span>磨</span><div><strong>磨飯 SMM</strong><small>員工登入</small></div></div>
      <form data-form="login">
        <label>Staff 編號<input name="username" autocomplete="username" inputmode="numeric" pattern="[0-9]{3,6}" minlength="3" maxlength="6" placeholder="輸入 3–6 位 Staff 編號" required></label>
        <label>6 位密碼<input name="password" type="password" autocomplete="current-password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="••••••" required></label>
        <label class="startup-remember"><input name="rememberLogin" type="checkbox" checked> 記住登入（關機／重開後仍然有效）</label>
        <p id="startup-error" class="startup-error" hidden></p>
        <button type="submit" class="startup-primary">登入</button>
      </form>
    </div>
    <div class="startup-card" data-startup-step="cash" hidden></div>
  </section>
  <script type="module" src="/shell-startup.js?v=smm-mobile-core-20260801e"></script>
  <script type="module" src="/smm/mobile-app.js?v=smm-mobile-core-20260801e"></script>
</body>
</html>
