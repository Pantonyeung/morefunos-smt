<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>More Fun SMT APK Foundation</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f5;color:#111;padding:24px}
    main{max-width:900px;margin:0 auto}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-bottom:16px}pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#fff;padding:14px;border-radius:12px}button{min-height:48px;padding:0 18px;border-radius:12px;border:0;font-weight:700}
  </style>
</head>
<body>
<main>
  <div class="card"><h1>More Fun SMT｜APK Foundation</h1><p>呢個頁面只用作原生 Shell／Bridge 實機驗證，唔代表正式 SMT UI。</p></div>
  <div class="card"><button id="refresh">重新讀取原生能力</button><pre id="out">讀取中…</pre></div>
</main>
<script>
  function readNative(){
    const out=document.getElementById('out');
    try{
      if(!window.MoreFunNative){throw new Error('MoreFunNative bridge unavailable');}
      const bridge=JSON.parse(window.MoreFunNative.getBridgeInfo());
      const device=JSON.parse(window.MoreFunNative.getDeviceInfo());
      const network=JSON.parse(window.MoreFunNative.getNetworkStatus());
      out.textContent=JSON.stringify({bridge,device,network},null,2);
    }catch(error){out.textContent=String(error&&error.stack||error);}
  }
  document.getElementById('refresh').addEventListener('click',readNative);
  readNative();
</script>
</body>
</html>
