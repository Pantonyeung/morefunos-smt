<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>磨飯 SMT｜尺寸驗收</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#161616;color:#fff;overflow:hidden}
    body{display:grid;grid-template-rows:auto minmax(0,1fr)}
    .toolbar{position:relative;z-index:5;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;align-items:center;gap:8px;overflow-x:auto;background:#111;border-bottom:1px solid #333;white-space:nowrap}
    .toolbar strong{font-size:14px;margin-right:4px}
    .toolbar button,.toolbar a{min-height:38px;padding:7px 11px;border:1px solid #444;border-radius:9px;background:#242424;color:#fff;font:inherit;font-size:13px;font-weight:800;text-decoration:none}
    .toolbar button.active{background:#ef5218;border-color:#ef5218}
    .viewport-area{position:relative;min-height:0;overflow:hidden;background:#090909}
    .chooser{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#27221f 0,#151515 58%,#0b0b0b 100%)}
    .chooser-card{width:min(440px,100%);display:grid;gap:14px;padding:20px;border:1px solid #3a3531;border-radius:18px;background:#1b1918;box-shadow:0 20px 60px #0008}
    .chooser-card h1{margin:0;font-size:22px}.chooser-card p{margin:0;color:#c8c0ba;line-height:1.5;font-size:14px}
    .size-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.size-grid button{min-height:52px;border:1px solid #4b443f;border-radius:12px;background:#26211e;color:#fff;font:900 14px/1 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif}.size-grid button:last-child:nth-child(odd){grid-column:1/-1}.size-grid button:active{transform:scale(.985)}
    .canvas{position:absolute;left:50%;top:50%;transform-origin:center center;background:#fff;box-shadow:0 0 0 1px #555,0 18px 60px #000b}
    iframe{display:block;border:0;width:100%;height:100%;background:#fff}
    .badge{position:absolute;z-index:4;right:8px;bottom:8px;padding:6px 9px;border-radius:8px;background:#000c;color:#fff;font-size:12px;pointer-events:none}
    .back-select{position:absolute;z-index:5;left:8px;bottom:8px;min-height:36px;padding:6px 10px;border:1px solid #555;border-radius:9px;background:#111d;color:#fff;font:800 12px/1 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif}
    [hidden]{display:none!important}
    @media(max-width:520px){.toolbar{padding-left:8px;padding-right:8px}.toolbar strong{font-size:13px}.chooser{padding:12px}.chooser-card{padding:16px}.size-grid{grid-template-columns:1fr}.size-grid button:last-child:nth-child(odd){grid-column:auto}.badge{max-width:72vw;white-space:normal;text-align:right}}
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="尺寸驗收工具">
    <strong>尺寸驗收</strong>
    <span id="currentLabel">未選尺寸</span>
    <a href="index.html#/order">返回正常模式</a>
  </nav>
  <main class="viewport-area" id="area">
    <section class="chooser" id="chooser">
      <div class="chooser-card">
        <h1>選擇要驗收嘅畫面尺寸</h1>
        <p>手機直屏會保持呢個驗收工具可操作。揀尺寸之後，SMT 會以指定橫屏解析度完整縮放喺目前畫面，方便逐位檢查走位。</p>
        <div class="size-grid">
          <button data-size="1920x1080">1920 × 1080</button>
          <button data-size="1600x900">1600 × 900</button>
          <button data-size="1440x900">1440 × 900</button>
          <button data-size="1366x768">1366 × 768</button>
          <button data-size="1280x800">1280 × 800</button>
        </div>
      </div>
    </section>
    <section class="canvas" id="canvas" hidden><iframe id="preview" title="SMT 尺寸驗收"></iframe></section>
    <button class="back-select" id="backSelect" hidden>重新選尺寸</button>
    <div class="badge" id="badge" hidden></div>
  </main>
  <script>
    const presets={
      '1920x1080':[1920,1080],
      '1600x900':[1600,900],
      '1440x900':[1440,900],
      '1366x768':[1366,768],
      '1280x800':[1280,800]
    };
    const area=document.getElementById('area');
    const chooser=document.getElementById('chooser');
    const canvas=document.getElementById('canvas');
    const frame=document.getElementById('preview');
    const badge=document.getElementById('badge');
    const backSelect=document.getElementById('backSelect');
    const currentLabel=document.getElementById('currentLabel');
    let selected='';

    function apply(){
      if(!selected||!presets[selected]||canvas.hidden)return;
      const [width,height]=presets[selected];
      const rect=area.getBoundingClientRect();
      const scale=Math.min(rect.width/width,rect.height/height);
      canvas.style.width=width+'px';
      canvas.style.height=height+'px';
      canvas.style.transform=`translate(-50%,-50%) scale(${scale})`;
      badge.textContent=`模擬 ${width}×${height}｜畫面縮放 ${Math.round(scale*100)}%`;
    }

    function openSize(name){
      if(!presets[name])return;
      selected=name;
      const [width,height]=presets[name];
      currentLabel.textContent=`${width}×${height}`;
      chooser.hidden=true;
      canvas.hidden=false;
      badge.hidden=false;
      backSelect.hidden=false;
      frame.style.width=width+'px';
      frame.style.height=height+'px';
      frame.src='index.html?embedded-preview=1#/order';
      requestAnimationFrame(apply);
    }

    function showChooser(){
      selected='';
      currentLabel.textContent='未選尺寸';
      frame.src='about:blank';
      canvas.hidden=true;
      badge.hidden=true;
      backSelect.hidden=true;
      chooser.hidden=false;
    }

    document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>openSize(button.dataset.size)));
    backSelect.addEventListener('click',showChooser);
    addEventListener('resize',apply,{passive:true});
    showChooser();
  </script>
</body>
</html>
